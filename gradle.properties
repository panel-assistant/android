org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin daemon otherwise inherits the 2 GB heap above, and compiling the debug and release variants together ran it out of memory on the private CI runner.
kotlin.daemon.jvmargs=-Xmx3072m
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults to testing only the tested (debug) build type. Keep the release JVM suite as an
# independent compiler/optimizer compatibility gate for the supported panel fleet.
android.onlyEnableUnitTestForTheTestedBuildType=false
kotlin.code.style=official
