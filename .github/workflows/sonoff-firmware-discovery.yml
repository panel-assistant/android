name: Sonoff firmware discovery
run-name: Sonoff firmware discovery · ${{ github.event_name }}

# Search the CoolKit OTA CDN for NSPanel Pro releases newer than the index.
#
# This is a different question from the one `firmware-url-monitor.yml` answers.
# That job re-checks URLs that are ALREADY indexed and reports availability; a
# green run there says nothing about whether new firmware shipped. Discovery
# was manual until now, and it went stale: 4.8.0 shipped on both channels and
# sat unindexed while the availability monitor reported green every day.
#
# The bucket cannot be listed, so discovery guesses forward from the index —
# the next few per-build serials crossed with plausible next version numbers —
# and confirms each hit by ZIP magic. That makes a false negative the failure
# mode to design against, so the job validates its own prober against
# known-good indexed objects first and aborts red if it cannot see them. A
# clean "nothing new" is only reported when the prober demonstrably works.
#
# On a find it appends the entries to fw-120p.dat / fw-86p.dat, re-runs the
# availability probe to validate every new URL and byte size against the CDN,
# and opens a pull request. main requires a reviewed PR, so it cannot push
# directly. Discussion #7 is regenerated by the availability monitor from the
# .dat, so nothing extra is needed here.
#
# The doc sweep is deliberately left to a human: a new version also touches
# docs/hardware/nspanel-pro.md and nspanel-pro-firmware.md, and those carry
# hardware-verification claims that must not be widened automatically.
#
# No secrets required — the PR is opened with the built-in GITHUB_TOKEN.

on:
  schedule:
    - cron: "23 11 * * *"   # daily, after the availability monitor (08:23) and Shelly (09:47)
  workflow_dispatch:
    inputs:
      mode:
        description: Report only, or open a pull request with the new entries
        required: true
        type: choice
        default: report
        options:
          - report
          - update

permissions:
  contents: read

concurrency:
  group: sonoff-firmware-discovery
  cancel-in-progress: false

jobs:
  # Read-only default for manual runs: no write permissions at all, so an
  # exploratory dispatch cannot change the index or open a PR.
  report:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Search the CDN for unindexed releases
        run: python tools/firmware-index/firmware_index.py discover

  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'update')
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # the CDN search alone took 17-19 min in September 2026
    permissions:
      contents: write       # push the update branch
      pull-requests: write  # open/update the index PR (main requires PR review)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Needed before the archive page is regenerated below. Fetched here rather
      # than next to that step so a missing branch fails the run early instead of
      # after the index has already been modified.
      - name: Restore Wayback state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" wayback-state >/dev/null 2>&1; then
            git fetch -q "$repo_url" wayback-state
            git show FETCH_HEAD:wayback.json > wayback.json
          else
            echo "::notice::no wayback-state branch yet; archive coverage will be empty"
            echo '{"files":{}}' > wayback.json
          fi

      # Aborts non-zero if the prober cannot see known-good objects, so a broken
      # prober fails the run instead of reporting a clean negative forever.
      - name: Search the CDN for unindexed releases
        id: discover
        run: python tools/firmware-index/firmware_index.py discover --apply

      # Independent confirmation through the availability path: every URL in the
      # index, including the newly appended ones, must resolve at its recorded
      # byte size. A discovery that cannot survive this does not become a PR.
      - name: Validate the updated index against the CDN
        if: steps.discover.outputs.found == 'true'
        run: |
          python tools/firmware-index/firmware_index.py probe --history /tmp/discovery-history.json
          python tools/firmware-index/firmware_index.py render --wayback wayback.json --out /tmp/discovery-discussion.md

      - name: Open/update pull request with the firmware index
        if: steps.discover.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSIONS: ${{ steps.discover.outputs.versions }}
        run: |
          branch="automation/sonoff-firmware-index"
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          msg="data: NSPanel Pro firmware index update"
          if [ -n "$NEW_VERSIONS" ]; then
            msg="data: NSPanel Pro $NEW_VERSIONS discovered"
          fi

          p120="$(cat tools/firmware-index/fw-120p.dat)"
          p86="$(cat tools/firmware-index/fw-86p.dat)"
          remote_head="$(git ls-remote --heads "$repo_url" "refs/heads/$branch" | awk 'NR == 1 { print $1 }')"
          if [ -n "$remote_head" ]; then
            git fetch -q "$repo_url" "$branch"
          fi
          # The automation branch is derived from the current main checkout on every
          # run. Rediscovery preserves pending CDN findings without allowing a stale
          # branch snapshot to overwrite releases that main has since indexed.
          git checkout -q -B "$branch"
          printf '%s\n' "$p120" > tools/firmware-index/fw-120p.dat
          printf '%s\n' "$p86" > tools/firmware-index/fw-86p.dat

          # The exhaustive in-repo index is generated from the .dat files, and a
          # data-derived test fails if it drifts from them. Regenerate it in the
          # same commit so a discovery PR is never merged into a red main.
          # The archival state must be supplied: without it every capture date
          # and full-ROM archive link would be rewritten to a gap marker, which
          # the URL-only drift test cannot see. The generator refuses to lose
          # coverage, so a failure here is a real one, not a formality.
          python tools/firmware-index/firmware_index.py archive --wayback wayback.json

          git add tools/firmware-index/fw-120p.dat tools/firmware-index/fw-86p.dat \
                  docs/hardware/nspanel-pro-firmware-archive.md
          # Compare the generated page too. Comparing only the .dat files would
          # exit early whenever the index is unchanged but the archive page is
          # not — new capture dates, or a page regenerated from stale archival
          # state — leaving the branch carrying a page that no longer matches
          # what this run produced.
          if [ -n "$remote_head" ] && git diff --quiet FETCH_HEAD -- \
              tools/firmware-index/fw-120p.dat tools/firmware-index/fw-86p.dat \
              docs/hardware/nspanel-pro-firmware-archive.md; then
            echo "pending automation branch already contains this exact index"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "nothing new to commit onto $branch"
            exit 0
          fi
          git commit -q -m "$msg"
          if [ -n "$remote_head" ]; then
            git push -q --force-with-lease="refs/heads/$branch:$remote_head" "$repo_url" "HEAD:$branch"
          else
            git push -q "$repo_url" "HEAD:$branch"
          fi

          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "$msg" \
              --body "Automated NSPanel Pro firmware discovery. Every appended URL was confirmed by ZIP magic and re-validated at its recorded byte size against the CDN.

          Before merging, sweep the surfaces the index does not cover: \`docs/hardware/nspanel-pro.md\` and \`docs/hardware/nspanel-pro-firmware.md\`. Do not widen any hardware-verification claim — that boundary is set by what has actually been flashed on a panel, not by what shipped. Full ROMs are not discoverable automatically (their filenames embed a build date), so check for one by hand if this release needs a checkpoint."
          fi
