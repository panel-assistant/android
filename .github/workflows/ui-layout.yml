# Web interface layout. The language layout gate lays out every page in every catalogue locale, light and
# dark, Chromium and WebKit, at the panel sizes and in the Panel Assistant sidebar views, and fails on
# cut-off text, overflow or overlap, unreachable controls and excess wrapping. Groups of pages per browser
# run in parallel; the `ui-layout` job aggregates them so a single required check can be configured.
# The CLS matrix stays report-only. Nothing in ci.yml needs or waits for this workflow. See tools/test/README.md.
name: UI layout
run-name: UI layout · ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    paths: ['app/src/main/assets/**', 'tools/test/**', '.github/workflows/ui-layout.yml']
  push:
    branches: [main]
    paths: ['app/src/main/assets/**', 'tools/test/**', '.github/workflows/ui-layout.yml']
  workflow_dispatch:

# A push supersedes the run before it, so group by ref and let the newer run cancel the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every browser job runs in Playwright's own image for the pinned playwright-core version, which carries
# both browsers, their system libraries and fonts: nothing is downloaded from the Ubuntu mirror, whose
# stalls held installs until the 20-minute timeout. Keep the image tag equal to tools/test's
# playwright-core version (a test in tools/test enforces it). Chromium is that image's build, passed to the
# tests as CHROME.
jobs:
  # The rest of tools/test: behaviour tests and the layout gate's own negative controls, in three shards.
  suite:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && vars.CI_RUNNER == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: suite · ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Install playwright-core
        run: cd tools/test && npm ci --ignore-scripts
      - name: Use the hosted runners' default font
        # The image's only Latin sans fonts lose to a CJK default for system-ui; the layout checks are tuned
        # to DejaVu Sans, the hosted runners' default. Two pinned packages, fetched directly, no apt index.
        run: |
          cd "$RUNNER_TEMP"
          get() { curl -fsS --retry 3 --retry-all-errors --max-time 60 -o "$1" "http://archive.ubuntu.com/ubuntu/pool/main/f/fonts-dejavu/$1"; }
          get fonts-dejavu-core_2.37-8_all.deb
          get fonts-dejavu-mono_2.37-8_all.deb
          printf '%s  %s\n' \
            40049660c194f3b8a2541fc7369efebb10e9f94bdac836a2f38fafedd10fa73a fonts-dejavu-core_2.37-8_all.deb \
            8a599d6553307db7ecb795d2f0e5a301e03234afc75c7358b0ba43466454c89a fonts-dejavu-mono_2.37-8_all.deb | sha256sum -c -
          dpkg -i fonts-dejavu-mono_2.37-8_all.deb fonts-dejavu-core_2.37-8_all.deb > /dev/null
          fc-match system-ui | grep -q 'DejaVu Sans'
      - name: Run tools/test
        run: |
          cd tools/test
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          test -x "$CHROME"
          # Tests that read app/build/test-fixtures need the JVM unit tests' output, so ci.yml runs them.
          tests=()
          for test in ./*.test.mjs; do grep -q 'test-fixtures' "$test" || tests+=("$test"); done
          node --test --test-shard=${{ matrix.shard }}/3 "${tests[@]}"

  # Each job runs a group of one browser's pages two at a time, each in its own process and fixture server.
  layout:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && vars.CI_RUNNER == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Each browser's pages split by measured gate time so no group runs much past two minutes.
        # Keep in step with tools/test/language-layout/pages/index.mjs (a test in tools/test enforces it).
        include:
          - { browser: webkit, pages: configure }
          - { browser: webkit, pages: install setup }
          - { browser: webkit, pages: logs entities }
          - { browser: webkit, pages: profiles api dashboard }
          - { browser: chromium, pages: configure install }
          - { browser: chromium, pages: profiles logs }
          - { browser: chromium, pages: api entities setup dashboard }
    name: layout · ${{ matrix.browser }} · ${{ matrix.pages }}
    env:
      LAYOUT_PAGE_LIST: ${{ matrix.pages }}
      LAYOUT_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Install playwright-core
        run: cd tools/test && npm ci --ignore-scripts
      - name: Use the hosted runners' default font
        # The image's only Latin sans fonts lose to a CJK default for system-ui; the layout checks are tuned
        # to DejaVu Sans, the hosted runners' default. Two pinned packages, fetched directly, no apt index.
        run: |
          cd "$RUNNER_TEMP"
          get() { curl -fsS --retry 3 --retry-all-errors --max-time 60 -o "$1" "http://archive.ubuntu.com/ubuntu/pool/main/f/fonts-dejavu/$1"; }
          get fonts-dejavu-core_2.37-8_all.deb
          get fonts-dejavu-mono_2.37-8_all.deb
          printf '%s  %s\n' \
            40049660c194f3b8a2541fc7369efebb10e9f94bdac836a2f38fafedd10fa73a fonts-dejavu-core_2.37-8_all.deb \
            8a599d6553307db7ecb795d2f0e5a301e03234afc75c7358b0ba43466454c89a fonts-dejavu-mono_2.37-8_all.deb | sha256sum -c -
          dpkg -i fonts-dejavu-mono_2.37-8_all.deb fonts-dejavu-core_2.37-8_all.deb > /dev/null
          fc-match system-ui | grep -q 'DejaVu Sans'
      - name: Language layout gate
        run: |
          cd tools/test
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          test -x "$CHROME"
          mkdir -p layout-out
          printf '%s\n' $LAYOUT_PAGE_LIST | xargs -P 2 -I{} sh -c \
            'LAYOUT_PAGES={} node --test language-layout-gate.mjs > layout-out/{}.log 2>&1; echo $? > layout-out/{}.rc'
          status=0
          for page in $LAYOUT_PAGE_LIST; do
            echo "::group::$page · $LAYOUT_BROWSERS"; cat "layout-out/$page.log"; echo "::endgroup::"
            if [ "$(cat "layout-out/$page.rc" 2>/dev/null)" != 0 ]; then
              echo "::error::layout gate failed for $page in $LAYOUT_BROWSERS"; status=1
            fi
          done
          exit $status

  # The single check to require: green only when every layout shard and the suite passed.
  ui-layout:
    if: always()
    needs: [suite, layout]
    runs-on: ubuntu-24.04
    steps:
      - name: Every layout and suite job passed
        run: |
          echo "suite=${{ needs.suite.result }} layout=${{ needs.layout.result }}"
          test "${{ needs.suite.result }}" = success
          test "${{ needs.layout.result }}" = success

  # Report-only layout stability; not part of the aggregate and not run on pushes to main.
  cls:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Install playwright-core
        run: cd tools/test && npm ci --ignore-scripts
      - name: Test CLS sampling policy
        run: cd tools/test && node --test layout-statistics.test.mjs
      - name: Run CLS matrix (report-only)
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -x "$CHROME"
          CHROME="$CHROME" node tools/test/layout-matrix.mjs | tee -a "$GITHUB_STEP_SUMMARY"
