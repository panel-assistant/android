name: Lint
run-name: Lint · ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

# Full Android lint takes about seven minutes on a hosted runner, so it runs beside CI rather than inside
# it: on every push to main, on pull requests, nightly and on demand. It replaces the release build's
# fatal-only lint pass, which CI and the Release workflow skip. The Release workflow requires this
# check to have passed on main for the exact commit it publishes, so it must run on every push to main
# without a path filter, and not on tags, where a newer run would hold the release until it finished.
on:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Branch and PR updates supersede their predecessors. Main checks belong to a
# commit, so later pushes cannot evict a release cut even while it is pending.
# Tags, manual trials and schedules each retain their own independent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Android lint
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && vars.CI_RUNNER == 'blacksmith' && (vars.CI_BLACKSMITH_HEAVY_RUNNER || 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Blacksmith serves actions/cache from beside its runners (a 423 MB Gradle entry restores in 2 s), so the
      # pinned SDK packages and setup-android's command-line tools come from it rather than dl.google.com, whose
      # NDK and command-line tools downloads took 6 to 53 s per job. Hosted runners skip it: this repository's
      # GitHub cache is at its 10 GB limit and an NDK entry would evict the Gradle caches. A miss or a stale
      # entry only costs the download, because the install step still checks every package.
      - name: Restore the Android SDK packages
        if: startsWith(runner.name, 'blacksmith-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/cmdline-tools/22.0
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/36.0.0
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-v1-${{ runner.os }}-cmdline-tools-22.0-platforms-37.0-build-tools-36.0.0-ndk-27.0.12077973-cmake-3.22.1

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools

      - name: Install Android build toolchain
        run: .github/scripts/install-android-sdk.sh "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced

      - name: Run full lint
        run: ./gradlew :app:lintDebug --configuration-cache --stacktrace

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
