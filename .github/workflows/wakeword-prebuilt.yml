name: Wake-word prebuilt
run-name: Wake-word prebuilt · ${{ github.head_ref || github.ref_name }}

# libhapaneld_mww.so is committed prebuilt so the app build does not compile TFLite Micro. This workflow
# rebuilds it from the vendored sources with the pinned NDK whenever those sources, the build script or
# the committed libraries change, and fails unless the result is byte-identical. CI's release split
# separately verifies that the committed libraries still match the sources recorded in the manifest.
on:
  pull_request:
    paths:
      - '.github/workflows/wakeword-prebuilt.yml'
      - 'app/src/main/cpp/microwakeword/**'
      - 'app/src/main/jniLibs/**'
      - 'tools/wakeword/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wakeword-prebuilt.yml'
      - 'app/src/main/cpp/microwakeword/**'
      - 'app/src/main/jniLibs/**'
      - 'tools/wakeword/**'
  workflow_dispatch:

permissions:
  contents: read

# Branch and PR updates supersede their predecessors. Main checks belong to a
# commit, so later pushes cannot evict a release cut even while it is pending.
# Tags, manual trials and schedules each retain their own independent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rebuild:
    name: Rebuild wake-word libraries
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && vars.CI_RUNNER == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # The same entry ci.yml and lint.yml restore (one key, one copy in the Blacksmith cache): the pinned NDK and
      # CMake took 18 s to download on the median push. Hosted runners skip it, as there: the repository's GitHub
      # cache is at its limit. A miss only costs the download, because the install step checks every package.
      - name: Restore the Android SDK packages
        if: startsWith(runner.name, 'blacksmith-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/cmdline-tools/22.0
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/36.0.0
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-v1-${{ runner.os }}-cmdline-tools-22.0-platforms-37.0-build-tools-36.0.0-ndk-27.0.12077973-cmake-3.22.1

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools

      - name: Install the pinned NDK and CMake
        run: .github/scripts/install-android-sdk.sh "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Rebuild and compare with the committed libraries
        run: tools/wakeword/build-prebuilt.sh check

  # Warns, never fails, when this push to main has taken longer than the workflow's budget in
  # .github/ci-budget.json, or when one of its set-up steps took longer than the per-step budget, so a
  # slowdown shows on the push that caused it rather than in the next weekly check. GitHub-hosted on purpose.
  budget:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the budget
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Compare this run's time with its budget
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_ci_budget.py --this-run
