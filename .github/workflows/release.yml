name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release dry run · {0}', inputs.release_tag) || format('Release {0}', github.ref_name) }}

# Before tagging, run the pre-tag checklist in docs/RELEASING.md. Editorial release docs are manual:
# write the docs/CHANGELOG.md section, reconcile README claims, and move shipped items out of "Planned"
# in docs/roadmap.md. The dynamic README release badge follows GitHub releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate vX.Y.Z or vX.Y.Z-suffix used to validate release inputs without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag and source commit
        run: |
          if [ "${#RELEASE_TAG}" -gt 64 ] || [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag is not an accepted vX.Y.Z or vX.Y.Z-suffix version: $RELEASE_TAG"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Candidate release tag is not a valid Git tag ref: $RELEASE_TAG"
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out source did not resolve to one commit."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main; then
              echo "::error::Release tag $RELEASE_TAG points to $source_commit, which is not on origin/main."
              exit 1
            fi
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Validate release catalogue provenance
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          from scripts.i18n_catalogue import LOCALES

          def fail(message):
              raise SystemExit(f"::error::{message}")

          def git(*arguments):
              return subprocess.run(
                  ["git", *arguments], check=True, capture_output=True, text=True
              ).stdout.strip()

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail("Release catalogue contains a duplicate JSON key.")
                  result[key] = value
              return result

          try:
              if git("rev-parse", "--is-shallow-repository") != "false":
                  fail("Release catalogue provenance requires full Git history.")
              source_commit = os.environ.get("SOURCE_COMMIT", "")
              if not re.fullmatch(r"[0-9a-f]{40}", source_commit) or source_commit != git("rev-parse", "HEAD"):
                  fail("Release catalogue source binding is invalid.")
              directory = Path("app/src/main/assets/i18n")
              expected = sorted(f"{locale}.json" for locale in {"en", *LOCALES})
              paths = sorted(directory.glob("*.json"))
              if [path.name for path in paths] != expected:
                  fail("Release catalogue files do not match the supported locales.")
              revisions = set()
              for path in paths:
                  catalogue = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
                  revision = catalogue.get("sourceRevision") if isinstance(catalogue, dict) else None
                  if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-f]{40}", revision):
                      fail("Release catalogue source revision is not one full commit SHA.")
                  revisions.add(revision)
              if len(revisions) != 1:
                  fail("Release catalogues do not share one source revision.")
              revision = revisions.pop()
              if git("cat-file", "-t", revision) != "commit":
                  fail("Release catalogue source revision does not name a commit.")
              ancestry = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", revision, source_commit],
                  check=False, capture_output=True,
              )
              if ancestry.returncode != 0:
                  fail("Release catalogue source revision is not an ancestor of the release source.")
          except (OSError, ValueError, RecursionError, subprocess.SubprocessError):
              fail("Unable to inspect release catalogue provenance.")
          print("Release catalogue provenance verified.")
          PY

      - name: Test release workflow contracts
        run: scripts/tests/release_workflow_test.sh

      # Expensive app, host, dependency-integrity and security analysis run when the exact source
      # lands on main. The tag workflow consumes their latest results instead of rerunning them, while
      # the package job independently creates release inputs from a clean checkout of the exact tag.
      - name: Require clean integrated checks for the source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_checks=(
            "Android build"
            "Host contracts"
            "Dependency integrity"
            "Privileged helper"
            "CodeQL · actions"
            "CodeQL · c-cpp"
            "CodeQL · java-kotlin"
            "CodeQL · javascript-typescript"
            "CodeQL · python"
          )
          max_attempts=60
          sleep_seconds=10
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT/check-runs?per_page=100")"
            pending=()
            for name in "${required_checks[@]}"; do
              latest="$(jq -c --arg name "$name" --arg source "$SOURCE_COMMIT" \
                '[.check_runs[] | select(.name == $name and .head_sha == $source and .app.slug == "github-actions")]
                 | max_by(.id) // {}' <<<"$checks")"
              status="$(jq -r '.status // "pending"' <<<"$latest")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"$latest")"
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  echo "::error::Latest required $name check for $SOURCE_COMMIT completed as $conclusion."
                  exit 1
                fi
              else
                pending+=("$name ($status)")
              fi
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Timed out waiting for required checks on $SOURCE_COMMIT: ${pending[*]}."
              exit 1
            fi
            echo "Waiting for required checks (${attempt}/${max_attempts}): ${pending[*]}"
            sleep "$sleep_seconds"
          done
          open_alerts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.tool.name == "CodeQL")] | length' | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$open_alerts" -ne 0 ]; then
            echo "::error::$open_alerts open CodeQL alert(s) must be fixed or explicitly dismissed before releasing."
            exit 1
          fi

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      input-manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag and source commit
        run: |
          if [ "${#RELEASE_TAG}" -gt 64 ] || [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag is not an accepted vX.Y.Z or vX.Y.Z-suffix version: $RELEASE_TAG"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Candidate release tag is not a valid Git tag ref: $RELEASE_TAG"
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out source did not resolve to one commit."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main; then
              echo "::error::Release tag $RELEASE_TAG points to $source_commit, which is not on origin/main."
              exit 1
            fi
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2

      - name: Verify profile-editor dependency graph and bundle
        working-directory: tools/profile-editor
        run: |
          expected_npm=$(node -p 'require("./package.json").packageManager.split("@").at(-1)')
          test "$(npm --version)" = "$expected_npm"
          npm ci --ignore-scripts --audit=false --fund=false
          npm run check
          npm run sbom -- --output ../../release-input/profile-editor-runtime.cdx.json

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools

      - name: Install Android build toolchain
        run: .github/scripts/install-android-sdk.sh "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build root helper release assets
        run: |
          set -euo pipefail
          mkdir -p release-input
          toolchain="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sources=(helper/src/*.c)
          helper_build_id="$(helper/source-id.sh)"
          [[ "$helper_build_id" =~ ^[0-9a-f]{64}$ ]]
          echo "HELPER_BUILD_ID=$helper_build_id" >> "$GITHUB_ENV"
          "$toolchain/armv7a-linux-androideabi26-clang" -O2 -s -Ihelper/src \
            -DHAPANELD_BUILD_ID="\"$helper_build_id\"" \
            -o release-input/hapaneld-helper-armeabi-v7a "${sources[@]}"
          "$toolchain/aarch64-linux-android26-clang" -O2 -s -Ihelper/src \
            -DHAPANELD_BUILD_ID="\"$helper_build_id\"" \
            -o release-input/hapaneld-helper-arm64-v8a "${sources[@]}"
          test -s release-input/hapaneld-helper-armeabi-v7a
          test -s release-input/hapaneld-helper-arm64-v8a
          file release-input/hapaneld-helper-armeabi-v7a | grep -Fq 'ELF 32-bit'
          file release-input/hapaneld-helper-arm64-v8a | grep -Fq 'ELF 64-bit'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify standalone helpers match APK-bundled helpers
        run: |
          cmp release-input/hapaneld-helper-armeabi-v7a app/src/main/assets/hapaneld-helper-arm
          cmp release-input/hapaneld-helper-arm64-v8a app/src/main/assets/hapaneld-helper-arm64

      - name: Generate release dependency SBOM
        run: ./gradlew :app:cyclonedxDirectBom --stacktrace

      - name: Collect unsigned release inputs
        run: |
          mkdir -p release-input
          mapfile -t unsigned_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print)
          if [ "${#unsigned_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one unsigned release APK, found ${#unsigned_apks[@]}."
            exit 1
          fi
          cp "${unsigned_apks[0]}" release-input/ha-paneld-unsigned.apk
          metadata=app/build/outputs/apk/release/output-metadata.json
          test -s "$metadata"
          application_id=$(node -e 'const m=require("./"+process.argv[1]); process.stdout.write(m.applicationId || "")' "$metadata")
          version_name=$(node -e 'const m=require("./"+process.argv[1]); const e=m.elements || []; process.stdout.write(e.length === 1 ? (e[0].versionName || "") : "")' "$metadata")
          expected_version_name="${RELEASE_TAG#v}"
          if [ "$application_id" != "io.github.maxlyth.hapaneld" ]; then
            echo "::error::Unsigned APK package is '$application_id', expected 'io.github.maxlyth.hapaneld'."
            exit 1
          fi
          if [ "$version_name" != "$expected_version_name" ]; then
            echo "::error::Unsigned APK versionName is '$version_name', expected '$expected_version_name' from the candidate release tag."
            exit 1
          fi
          test -s app/build/reports/cyclonedx-direct/bom.json
          cp app/build/reports/cyclonedx-direct/bom.json release-input/android-gradle-runtime.cdx.json
          cp scripts/generate_install_descriptor.py release-input/generate_install_descriptor.py
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Build release-pinned installer asset
        run: |
          installer="release-input/ha-paneld-installer-${RELEASE_TAG}.sh"
          provisioner="release-input/ha-paneld-provision-${RELEASE_TAG}.sh"
          sed \
            -e "s|^RELEASE_HELPER_BUILD_ID=.*|RELEASE_HELPER_BUILD_ID=\"$HELPER_BUILD_ID\"|" \
            scripts/provision.sh > "$provisioner"
          chmod +x "$provisioner"
          bash -n "$provisioner"
          sed \
            -e "s|^RELEASE_TAG=.*|RELEASE_TAG=\"$RELEASE_TAG\"|" \
            -e "s|^RELEASE_APK_NAME=.*|RELEASE_APK_NAME=\"$APK_NAME\"|" \
            -e "s|^PROVISION_COMMIT=.*|PROVISION_COMMIT=\"$SOURCE_COMMIT\"|" \
            scripts/install.sh > "$installer"
          chmod +x "$installer"
          bash -n "$installer"
          grep -Fq "RELEASE_TAG=\"$RELEASE_TAG\"" "$installer"
          grep -Fq "RELEASE_APK_NAME=\"$APK_NAME\"" "$installer"
          grep -Fq "PROVISION_COMMIT=\"$SOURCE_COMMIT\"" "$installer"
          grep -Fq "RELEASE_HELPER_BUILD_ID=\"$HELPER_BUILD_ID\"" "$provisioner"

      # Human-readable notes come only from the matching docs/CHANGELOG.md section, keeping the approved
      # consumer-facing body exact for both prereleases and stable releases.
      #
      # Section lookup — exact match first, base-version fallback:
      #   v0.8.4-rc3  →  look for "## v0.8.4-rc3"  (per-RC incremental notes)
      #   v0.8.4      →  look for "## v0.8.4"       (cumulative stable notes)
      # Each RC must have its own docs/CHANGELOG.md section describing only what changed since
      # the previous RC — repeating the prior section causes identical release notes.
      - name: Extract release notes from CHANGELOG
        run: |
          tag="$RELEASE_TAG"
          base="${tag%%-*}"     # v0.8.4-rc3 → v0.8.4 (used only as fallback for stable)

          extract() {
            awk -v t="$1" '/^## /{ if(found) exit; if($2==t){ found=1; next } } found' docs/CHANGELOG.md
          }

          extract "$tag" > release-input/release-body.md
          if [ ! -s release-input/release-body.md ] && [ "$tag" != "$base" ]; then
            echo "::error::No docs/CHANGELOG.md section for $tag — each RC needs its own ## $tag entry describing what changed since the previous RC. Add it before tagging."
            exit 1
          fi
          if [ ! -s release-input/release-body.md ]; then
            extract "$base" > release-input/release-body.md
          fi
          if [ ! -s release-input/release-body.md ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::No docs/CHANGELOG.md section for stable release $tag. Add an exact ## $tag entry before tagging."
              exit 1
            fi
            echo "::warning::Dry run has no docs/CHANGELOG.md section for stable candidate $tag."
            echo "_No changelog entry for $RELEASE_TAG._" > release-input/release-body.md
          fi
          changelog_body="$(mktemp)"
          mv release-input/release-body.md "$changelog_body"
          cat > release-input/release-body.md <<EOF
          ## Recommended installation

          **Do not use \`adb install\` directly.** It installs the APK but does not complete ha-paneld's permissions, startup, configuration, and verification.

          From macOS, Linux, Git Bash, or WSL, run:

          \`\`\`sh
          curl -fsSL https://github.com/maxlyth/ha-paneld/releases/download/$RELEASE_TAG/ha-paneld-installer-$RELEASE_TAG.sh | bash
          \`\`\`

          The \`$APK_NAME\` asset is for manual or on-device sideloading. After installing it, open ha-paneld and complete the on-panel setup.

          EOF
          cat "$changelog_body" >> release-input/release-body.md
          echo "----- release body -----"; cat release-input/release-body.md

      - name: Seal exact release inputs
        id: manifest
        run: |
          expected=$(printf '%s\n' \
            android-gradle-runtime.cdx.json \
            generate_install_descriptor.py \
            "ha-paneld-installer-${RELEASE_TAG}.sh" \
            "ha-paneld-provision-${RELEASE_TAG}.sh" \
            ha-paneld-unsigned.apk \
            hapaneld-helper-arm64-v8a \
            hapaneld-helper-armeabi-v7a \
            profile-editor-runtime.cdx.json \
            release-body.md)
          actual=$(find release-input -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release input set is not exact."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          (
            cd release-input
            sha256sum android-gradle-runtime.cdx.json generate_install_descriptor.py "ha-paneld-installer-${RELEASE_TAG}.sh" "ha-paneld-provision-${RELEASE_TAG}.sh" ha-paneld-unsigned.apk hapaneld-helper-arm64-v8a hapaneld-helper-armeabi-v7a profile-editor-runtime.cdx.json release-body.md > MANIFEST.sha256
          )
          sha256=$(sha256sum release-input/MANIFEST.sha256 | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload sealed release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-paneld-release-input-${{ github.run_id }}
          path: release-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          include-hidden-files: false

  sign-and-publish:
    if: github.event_name == 'push'
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download sealed release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ha-paneld-release-input-${{ github.run_id }}
          path: release-input

      - name: Verify exact release inputs
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.input-manifest-sha256 }}
        run: |
          if [[ ! "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Build job did not provide a valid release-input manifest digest."
            exit 1
          fi
          actual_manifest_sha256=$(sha256sum release-input/MANIFEST.sha256 | cut -d' ' -f1)
          if [ "$actual_manifest_sha256" != "$EXPECTED_MANIFEST_SHA256" ]; then
            echo "::error::Downloaded release-input manifest does not match the build job output."
            exit 1
          fi
          expected=$(printf '%s\n' \
            MANIFEST.sha256 \
            android-gradle-runtime.cdx.json \
            generate_install_descriptor.py \
            "ha-paneld-installer-${RELEASE_TAG}.sh" \
            "ha-paneld-provision-${RELEASE_TAG}.sh" \
            ha-paneld-unsigned.apk \
            hapaneld-helper-arm64-v8a \
            hapaneld-helper-armeabi-v7a \
            profile-editor-runtime.cdx.json \
            release-body.md)
          actual=$(find release-input -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Downloaded release input set is not exact."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          (cd release-input && sha256sum --check MANIFEST.sha256)

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools

      - name: Install pinned Android Build-Tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Reverify release inputs after tool setup
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.input-manifest-sha256 }}
        run: |
          test "$(sha256sum release-input/MANIFEST.sha256 | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          (cd release-input && sha256sum --check MANIFEST.sha256)

      - name: Sign and validate release APK
        id: asset
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required; refusing to publish a debug-signed release asset."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release-keystore"
          trap 'unset KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; /usr/bin/rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned_apk=release-input/ha-paneld-unsigned.apk
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          android_sbom_name="ha-paneld-${RELEASE_TAG}-android-gradle-runtime.cdx.json"
          profile_editor_sbom_name="ha-paneld-${RELEASE_TAG}-profile-editor-runtime.cdx.json"
          provisioner_name="ha-paneld-provision-${RELEASE_TAG}.sh"
          helper_arm_name="ha-paneld-helper-${RELEASE_TAG}-armeabi-v7a"
          helper_arm64_name="ha-paneld-helper-${RELEASE_TAG}-arm64-v8a"
          signed_apk="dist/$apk_name"
          apk_idsig="$signed_apk.idsig"
          /usr/bin/install -d -m 0755 dist

          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          if [ ! -f "$apk_idsig" ] || [ -L "$apk_idsig" ]; then
            echo "::error::APK Signature Scheme v4 sidecar is not one regular nofollow file."
            exit 1
          fi
          idsig_size=$(/usr/bin/stat --format='%s' "$apk_idsig")
          if [ "$idsig_size" -le 0 ] || [ "$idsig_size" -gt 1048576 ]; then
            echo "::error::APK Signature Scheme v4 sidecar is empty or exceeds 1 MiB."
            exit 1
          fi
          "$build_tools/apksigner" verify \
            --v4-signature-file "$apk_idsig" \
            --verbose \
            --print-certs \
            "$signed_apk"
          "$build_tools/zipalign" -c -P 16 4 "$signed_apk"
          /usr/bin/chmod 0644 "$signed_apk" "$apk_idsig"

          badging=$("$build_tools/aapt" dump badging "$signed_apk")
          package_line=${badging%%$'\n'*}
          package_name=$(printf '%s\n' "$package_line" | sed -n "s/.* name='\([^']*\)'.*/\1/p")
          version_name=$(printf '%s\n' "$package_line" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          expected_version_name="${RELEASE_TAG#v}"
          if [ "$package_name" != "io.github.maxlyth.hapaneld" ]; then
            echo "::error::Signed APK package is '$package_name', expected 'io.github.maxlyth.hapaneld'."
            exit 1
          fi
          if [ "$version_name" != "$expected_version_name" ]; then
            echo "::error::Signed APK versionName is '$version_name', expected '$expected_version_name' from the tag."
            exit 1
          fi

          mapfile -t signer_digests < <("$build_tools/apksigner" verify --v4-signature-file "$apk_idsig" --print-certs "$signed_apk" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          if [ "${#signer_digests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK signer, found ${#signer_digests[@]}."
            exit 1
          fi
          signer_digest=$(printf '%s' "${signer_digests[0]}" | tr '[:upper:]' '[:lower:]')
          expected_signer_digest=ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
          if [ "$signer_digest" != "$expected_signer_digest" ]; then
            echo "::error::Signed APK certificate SHA-256 is '$signer_digest', expected '$expected_signer_digest'."
            exit 1
          fi

          cp release-input/android-gradle-runtime.cdx.json "dist/$android_sbom_name"
          cp release-input/profile-editor-runtime.cdx.json "dist/$profile_editor_sbom_name"
          cp "release-input/ha-paneld-installer-${RELEASE_TAG}.sh" "dist/ha-paneld-installer-${RELEASE_TAG}.sh"
          cp "release-input/$provisioner_name" "dist/$provisioner_name"
          cp release-input/hapaneld-helper-armeabi-v7a "dist/$helper_arm_name"
          cp release-input/hapaneld-helper-arm64-v8a "dist/$helper_arm64_name"
          chmod +x "dist/ha-paneld-installer-${RELEASE_TAG}.sh"
          chmod +x "dist/$provisioner_name"
          chmod +x "dist/$helper_arm_name" "dist/$helper_arm64_name"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")
          (cd dist && sha256sum "$provisioner_name" > "$provisioner_name.sha256")
          (cd dist && sha256sum "$helper_arm_name" > "$helper_arm_name.sha256")
          (cd dist && sha256sum "$helper_arm64_name" > "$helper_arm64_name.sha256")

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "android_sbom_name=$android_sbom_name" >> "$GITHUB_OUTPUT"
          echo "profile_editor_sbom_name=$profile_editor_sbom_name" >> "$GITHUB_OUTPUT"

      - name: Generate bounded install descriptor without release credentials
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "::error::Release credentials must not enter the descriptor-generation step."
              exit 1
            fi
          done

          workspace=$(/usr/bin/pwd -P)
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          descriptor_name="ha-paneld-${RELEASE_TAG}-install.json"
          descriptor_stage=$(/usr/bin/mktemp -d "$RUNNER_TEMP/install-descriptor.XXXXXX")
          sandbox_source=$(/usr/bin/mktemp "$RUNNER_TEMP/install-descriptor-sandbox.XXXXXX.c")
          sandbox_binary=${sandbox_source%.c}
          current_uid=$(/usr/bin/id -u)
          current_gid=$(/usr/bin/id -g)
          root_command=()
          if [ "$current_uid" -ne 0 ]; then
            root_command=(/usr/bin/sudo --non-interactive)
          fi
          cleanup_descriptor_stage() {
            "${root_command[@]}" /usr/bin/rm -rf -- "$descriptor_stage" "$sandbox_source" "$sandbox_binary"
          }
          trap cleanup_descriptor_stage EXIT
          /usr/bin/tee "$sandbox_source" >/dev/null <<'LANDLOCK_SOURCE'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <linux/landlock.h>
          #include <stddef.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/prctl.h>
          #include <sys/syscall.h>
          #include <unistd.h>

          static int add_path_rule(int ruleset_fd, const char *path, __u64 allowed_access) {
              int path_fd = open(path, O_PATH | O_CLOEXEC);
              if (path_fd < 0) return -1;
              struct landlock_path_beneath_attr rule = {
                  .allowed_access = allowed_access,
                  .parent_fd = path_fd,
              };
              int result = syscall(SYS_landlock_add_rule, ruleset_fd,
                                   LANDLOCK_RULE_PATH_BENEATH, &rule, 0);
              int saved_errno = errno;
              close(path_fd);
              errno = saved_errno;
              return result;
          }

          int main(int argc, char **argv) {
              if (argc < 3) {
                  fputs("usage: sandbox OUTPUT-DIRECTORY PROGRAM [ARG...]\n", stderr);
                  return 64;
              }
              int abi = syscall(SYS_landlock_create_ruleset, NULL, 0,
                                LANDLOCK_CREATE_RULESET_VERSION);
              if (abi < 3) {
                  fputs("Landlock ABI 3 or newer is required\n", stderr);
                  return 70;
              }
              __u64 read_access = LANDLOCK_ACCESS_FS_EXECUTE |
                  LANDLOCK_ACCESS_FS_READ_FILE | LANDLOCK_ACCESS_FS_READ_DIR;
              __u64 write_access = LANDLOCK_ACCESS_FS_WRITE_FILE |
                  LANDLOCK_ACCESS_FS_REMOVE_DIR | LANDLOCK_ACCESS_FS_REMOVE_FILE |
                  LANDLOCK_ACCESS_FS_MAKE_CHAR | LANDLOCK_ACCESS_FS_MAKE_DIR |
                  LANDLOCK_ACCESS_FS_MAKE_REG | LANDLOCK_ACCESS_FS_MAKE_SOCK |
                  LANDLOCK_ACCESS_FS_MAKE_FIFO | LANDLOCK_ACCESS_FS_MAKE_BLOCK |
                  LANDLOCK_ACCESS_FS_MAKE_SYM | LANDLOCK_ACCESS_FS_REFER |
                  LANDLOCK_ACCESS_FS_TRUNCATE;
              struct landlock_ruleset_attr ruleset = {
                  .handled_access_fs = read_access | write_access,
              };
              int ruleset_fd = syscall(SYS_landlock_create_ruleset, &ruleset,
                                       sizeof(ruleset), 0);
              // Report which step refused. A single message for the whole chain cannot say
              // whether the ruleset, a path rule or the restriction itself failed, and the
              // difference decides the fix.
              if (ruleset_fd < 0) { perror("install descriptor sandbox create_ruleset"); return 70; }
              if (add_path_rule(ruleset_fd, "/", read_access) < 0) {
                  perror("install descriptor sandbox rule /"); return 70;
              }
              if (add_path_rule(ruleset_fd, "/dev", read_access) < 0) {
                  perror("install descriptor sandbox rule /dev"); return 70;
              }
              if (add_path_rule(ruleset_fd, "/proc", read_access) < 0) {
                  perror("install descriptor sandbox rule /proc"); return 70;
              }
              if (add_path_rule(ruleset_fd, "/sys", read_access) < 0) {
                  perror("install descriptor sandbox rule /sys"); return 70;
              }
              if (add_path_rule(ruleset_fd, argv[1], read_access | write_access) < 0) {
                  fprintf(stderr, "install descriptor sandbox rule %s: %s\n",
                          argv[1], strerror(errno));
                  return 70;
              }
              if (prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) < 0) {
                  perror("install descriptor sandbox no_new_privs"); return 70;
              }
              if (syscall(SYS_landlock_restrict_self, ruleset_fd, 0) < 0) {
                  perror("install descriptor sandbox restrict_self"); return 70;
              }
              close(ruleset_fd);
              execv(argv[2], &argv[2]);
              perror("install descriptor sandbox exec");
              return 70;
          }
          LANDLOCK_SOURCE
          /usr/bin/cc -O2 -Wall -Wextra -Werror -o "$sandbox_binary" "$sandbox_source"
          /usr/bin/chmod 0755 "$sandbox_binary"
          "${root_command[@]}" /usr/bin/chown 65534:65534 "$descriptor_stage"
          "${root_command[@]}" /usr/bin/chmod 0700 "$descriptor_stage"
          # The generator runs as an unprivileged identity and has to open the stage to place
          # its own Landlock rule on it. Owning the directory is not enough: every directory
          # on the way to it has to be traversable, or that open is refused before the sandbox
          # is ever applied. Grant traversal alone, so the path can be walked but not listed.
          descriptor_ancestor=$descriptor_stage
          while descriptor_ancestor=$(/usr/bin/dirname "$descriptor_ancestor"); do
            "${root_command[@]}" /usr/bin/chmod o+x "$descriptor_ancestor"
            [ "$descriptor_ancestor" != / ] || break
          done

          "${root_command[@]}" /usr/bin/setpriv \
            --reuid=65534 \
            --regid=65534 \
            --clear-groups \
            --no-new-privs \
            --inh-caps=-all \
            --ambient-caps=-all \
            --bounding-set=-all \
            "$sandbox_binary" "$descriptor_stage" \
              /usr/bin/env -i \
                "HOME=$descriptor_stage" \
                "JAVA_HOME=$JAVA_HOME" \
                'LC_ALL=C.UTF-8' \
                'PATH=/usr/bin:/bin' \
                'PYTHONDONTWRITEBYTECODE=1' \
                'PYTHONHASHSEED=0' \
                "TMPDIR=$descriptor_stage" \
                /usr/bin/python3 "$workspace/release-input/generate_install_descriptor.py" \
                  --apk "$workspace/dist/$apk_name" \
                  --release-tag "$RELEASE_TAG" \
                  --aapt "$build_tools/aapt" \
                  --apksigner "$build_tools/apksigner" \
                  --output "$descriptor_stage/$descriptor_name"

          staged_entries=$("${root_command[@]}" /usr/bin/find "$descriptor_stage" -mindepth 1 -maxdepth 1 -printf '%f\n' | /usr/bin/sort)
          if [ "$staged_entries" != "$descriptor_name" ]; then
            echo "::error::Descriptor generator did not produce exactly the expected output."
            exit 1
          fi
          if ! "${root_command[@]}" /usr/bin/test -f "$descriptor_stage/$descriptor_name" || \
             "${root_command[@]}" /usr/bin/test -L "$descriptor_stage/$descriptor_name"; then
            echo "::error::Descriptor generator output is not one regular nofollow file."
            exit 1
          fi
          "${root_command[@]}" /usr/bin/install \
            --owner="$current_uid" \
            --group="$current_gid" \
            --mode=0644 \
            "$descriptor_stage/$descriptor_name" \
            "$workspace/dist/$descriptor_name"

      - name: Sign and authenticate release proofs
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required to authenticate release proofs."
              exit 1
            fi
          done

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          descriptor_name="ha-paneld-${RELEASE_TAG}-install.json"
          provisioner_name="ha-paneld-provision-${RELEASE_TAG}.sh"
          helper_arm_name="ha-paneld-helper-${RELEASE_TAG}-armeabi-v7a"
          helper_arm64_name="ha-paneld-helper-${RELEASE_TAG}-arm64-v8a"
          signed_apk="dist/$apk_name"
          apk_idsig="$signed_apk.idsig"
          proof_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/release-proof.XXXXXX")
          keystore="$proof_dir/release-keystore"
          pkcs12="$proof_dir/release-key.p12"
          private_key="$proof_dir/release-private-key.pem"
          public_key="$proof_dir/release-public-key.pem"
          installer_public_key="$proof_dir/installer-public-key.pem"
          provisioner_public_key="$proof_dir/provisioner-public-key.pem"
          expected_descriptor="$proof_dir/expected-install.json"
          cleanup_release_proofs() {
            unset KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD HAPANELD_PKCS12_PASSWORD
            /usr/bin/rm -rf -- "$proof_dir"
          }
          trap cleanup_release_proofs EXIT

          if [ ! -f "$signed_apk" ] || [ -L "$signed_apk" ]; then
            echo "::error::Signed release APK is not one regular nofollow file."
            exit 1
          fi
          apk_size=$(/usr/bin/stat --format='%s' "$signed_apk")
          if [ "$apk_size" -le 0 ] || [ "$apk_size" -gt 67108864 ]; then
            echo "::error::Signed release APK is empty or exceeds the 64 MiB installer limit."
            exit 1
          fi
          "$build_tools/apksigner" verify \
            --v4-signature-file "$apk_idsig" \
            --verbose \
            --print-certs \
            "$signed_apk"
          mapfile -t signer_digests < <("$build_tools/apksigner" verify --v4-signature-file "$apk_idsig" --print-certs "$signed_apk" | /usr/bin/sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          if [ "${#signer_digests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK signer, found ${#signer_digests[@]}."
            exit 1
          fi
          signer_digest=$(/usr/bin/printf '%s' "${signer_digests[0]}" | /usr/bin/tr '[:upper:]' '[:lower:]')
          expected_signer_digest=ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
          if [ "$signer_digest" != "$expected_signer_digest" ]; then
            echo "::error::Signed APK certificate SHA-256 does not match the release authority."
            exit 1
          fi

          apk_sha256=$(/usr/bin/sha256sum "$signed_apk" | /usr/bin/cut -d' ' -f1)
          /usr/bin/printf '%s  %s\n' "$apk_sha256" "$apk_name" > "$proof_dir/$apk_name.sha256"
          if ! /usr/bin/cmp --silent "$proof_dir/$apk_name.sha256" "dist/$apk_name.sha256" || \
             ! (cd dist && /usr/bin/sha256sum --strict --check "$apk_name.sha256"); then
            echo "::error::Signed APK checksum record does not bind the exact APK."
            exit 1
          fi

          badging=$("$build_tools/aapt" dump badging "$signed_apk")
          mapfile -t package_lines < <(/usr/bin/grep '^package:' <<<"$badging")
          mapfile -t sdk_lines < <(/usr/bin/grep '^sdkVersion:' <<<"$badging")
          mapfile -t launch_lines < <(/usr/bin/grep '^launchable-activity:' <<<"$badging")
          mapfile -t native_lines < <(/usr/bin/grep '^native-code:' <<<"$badging")
          if [ "${#package_lines[@]}" -ne 1 ] || [ "${#sdk_lines[@]}" -ne 1 ] || \
             [ "${#launch_lines[@]}" -ne 1 ] || [ "${#native_lines[@]}" -ne 1 ]; then
            echo "::error::Signed APK badging is ambiguous or incomplete."
            exit 1
          fi
          package_name=$(/usr/bin/sed -n "s/.* name='\([^']*\)'.*/\1/p" <<<"${package_lines[0]}")
          version_code=$(/usr/bin/sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<<"${package_lines[0]}")
          version_name=$(/usr/bin/sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<<"${package_lines[0]}")
          min_sdk=$(/usr/bin/sed -n "s/^sdkVersion:'\([^']*\)'$/\1/p" <<<"${sdk_lines[0]}")
          launch_activity=$(/usr/bin/sed -n "s/.* name='\([^']*\)'.*/\1/p" <<<"${launch_lines[0]}")
          mapfile -t supported_abis < <(/usr/bin/grep -o "'[^']*'" <<<"${native_lines[0]}" | /usr/bin/tr -d "'" | /usr/bin/sort)
          expected_version_name="${RELEASE_TAG#v}"
          if [ "$package_name" != io.github.maxlyth.hapaneld ] || \
             [ "$version_name" != "$expected_version_name" ] || \
             [ "$launch_activity" != io.github.maxlyth.hapaneld.MainActivity ] || \
             [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]] || [ "${#version_code}" -gt 10 ] || \
             [ "$version_code" -gt 2147483647 ] || \
             [[ ! "$min_sdk" =~ ^[1-9][0-9]*$ ]] || [ "${#min_sdk}" -gt 3 ] || [ "$min_sdk" -gt 100 ] || \
             [ "${#supported_abis[@]}" -ne 2 ] || \
             [ "${supported_abis[0]}" != arm64-v8a ] || [ "${supported_abis[1]}" != armeabi-v7a ]; then
            echo "::error::Signed APK package, version, platform, ABI, or launcher contract is invalid."
            exit 1
          fi

          xmltree=$("$build_tools/aapt" dump xmltree "$signed_apk" AndroidManifest.xml)
          database_contracts=$(/usr/bin/printf '%s\n' "$xmltree" | /usr/bin/awk -v wanted='io.github.maxlyth.hapaneld.DATABASE_COMPATIBILITY' '
            function quoted(line, start, rest, stop) {
              start=index(line, "=\""); if (!start) return ""
              rest=substr(line, start + 2); stop=index(rest, "\"")
              return stop ? substr(rest, 1, stop - 1) : ""
            }
            function indentation(line, copy) { copy=line; sub(/[^ ].*/, "", copy); return length(copy) }
            function flush_meta() {
              if (!inside) return
              if (saw_wanted) {
                if (direct_meta && name_count == 1 && name == wanted && value_count == 1) print value
                else invalid=1
              }
              inside=0
            }
            /^[[:space:]]*E:/ {
              flush_meta()
              indent=indentation($0)
              entity=$0; sub(/^[[:space:]]*E:[[:space:]]*/, "", entity); sub(/[[:space:](].*/, "", entity)
              parent=""; parent_node_id=-1; parent_indent=-1
              for (level in stack) if ((level + 0) < indent && (level + 0) > parent_indent) {
                parent=stack[level]; parent_node_id=stack_node[level]; parent_indent=level + 0
              }
              for (level in stack) if ((level + 0) >= indent) {
                delete stack[level]; delete stack_node[level]
              }
              node_id++
              stack[indent]=entity; stack_node[indent]=node_id
              if (entity == "manifest" && parent_indent == -1) {
                manifest_count++; manifest_node_id=node_id
              }
              if (entity == "application" && parent == "manifest" && parent_node_id == manifest_node_id) {
                application_count++; application_node_id=node_id
              }
              if (entity == "meta-data") {
                inside=1; name=""; value=""; name_count=0; value_count=0; saw_wanted=0
                direct_meta=(parent == "application" && parent_node_id == application_node_id)
              }
              next
            }
            inside && /A: (android:|http:\/\/schemas\.android\.com\/apk\/res\/android:)name/ {
              candidate=quoted($0); name_count++; name=candidate; if (candidate == wanted) saw_wanted=1
            }
            inside && /A: (android:|http:\/\/schemas\.android\.com\/apk\/res\/android:)value/ {
              value_count++; value=quoted($0)
            }
            END {
              flush_meta()
              if (manifest_count != 1 || application_count != 1 || invalid) print "__INVALID_APPLICATION_METADATA__"
            }
          ')
          mapfile -t database_records < <(/usr/bin/awk 'NF' <<<"$database_contracts")
          if [ "${#database_records[@]}" -ne 1 ] || \
             [[ ! "${database_records[0]}" =~ ^hapaneld-db:v1:ha-paneld\.db:([1-9][0-9]*):([1-9][0-9]*)$ ]]; then
            echo "::error::Signed APK database compatibility contract is invalid."
            exit 1
          fi
          database_min=${BASH_REMATCH[1]}
          database_max=${BASH_REMATCH[2]}
          if [ "${#database_min}" -gt 10 ] || [ "${#database_max}" -gt 10 ] || \
             [ "$database_min" -gt 2147483647 ] || [ "$database_max" -gt 2147483647 ] || \
             [ "$database_min" -gt "$database_max" ]; then
            echo "::error::Signed APK database compatibility bounds are invalid."
            exit 1
          fi
          database_contract=${database_records[0]}

          if [ ! -f "dist/$descriptor_name" ] || [ -L "dist/$descriptor_name" ] || \
             [ "$(/usr/bin/stat --format='%s' "dist/$descriptor_name")" -gt 4096 ]; then
            echo "::error::Install descriptor is not a bounded regular nofollow file."
            exit 1
          fi
          /usr/bin/jq -cnS \
            --arg apk_name "$apk_name" \
            --arg apk_sha256 "$apk_sha256" \
            --argjson apk_size "$apk_size" \
            --arg database_compatibility "$database_contract" \
            --argjson min_sdk "$min_sdk" \
            --arg release_tag "$RELEASE_TAG" \
            --argjson version_code "$version_code" \
            --arg version_name "$version_name" \
            '{apkName:$apk_name,apkSha256:$apk_sha256,apkSize:$apk_size,databaseCompatibility:$database_compatibility,launchComponent:"io.github.maxlyth.hapaneld/.MainActivity",minSdk:$min_sdk,packageId:"io.github.maxlyth.hapaneld",releaseTag:$release_tag,schema:"io.github.maxlyth.hapaneld.install.v1",signerCertificateSha256:"ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339",supportedAbis:["arm64-v8a","armeabi-v7a"],versionCode:$version_code,versionName:$version_name}' \
            > "$expected_descriptor"
          if ! /usr/bin/cmp --silent "$expected_descriptor" "dist/$descriptor_name"; then
            echo "::error::Install descriptor is not the exact canonical 13-field APK contract."
            exit 1
          fi

          for source in "dist/ha-paneld-installer-${RELEASE_TAG}.sh" "dist/$provisioner_name"; do
            if [ ! -f "$source" ] || [ -L "$source" ] || \
               [ "$(/usr/bin/grep -c '^-----BEGIN PUBLIC KEY-----$' "$source")" -ne 1 ] || \
               [ "$(/usr/bin/grep -c '^-----END PUBLIC KEY-----$' "$source")" -ne 1 ]; then
              echo "::error::Release script does not contain exactly one trusted public key."
              exit 1
            fi
          done
          /usr/bin/awk '/^-----BEGIN PUBLIC KEY-----$/{copy=1} copy{print} /^-----END PUBLIC KEY-----$/{exit}' \
            "dist/ha-paneld-installer-${RELEASE_TAG}.sh" > "$installer_public_key"
          /usr/bin/awk '/^-----BEGIN PUBLIC KEY-----$/{copy=1} copy{print} /^-----END PUBLIC KEY-----$/{exit}' \
            "dist/$provisioner_name" > "$provisioner_public_key"
          if ! /usr/bin/cmp --silent "$installer_public_key" "$provisioner_public_key"; then
            echo "::error::Release scripts disagree on the trusted public key."
            exit 1
          fi
          trusted_public_key_sha256=$(/usr/bin/openssl pkey -pubin -in "$installer_public_key" -outform DER | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)
          if [ "$trusted_public_key_sha256" != 502bf38874682ff337f187022b904adbc3ab0b387fd7ceb4043ce722997273f3 ]; then
            echo "::error::Release scripts do not embed the release proof authority."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | /usr/bin/base64 --decode > "$keystore"
          /usr/bin/chmod 0600 "$keystore"
          HAPANELD_PKCS12_PASSWORD=$(/usr/bin/openssl rand -hex 32)
          export HAPANELD_PKCS12_PASSWORD
          "$JAVA_HOME/bin/keytool" -importkeystore \
            -srckeystore "$keystore" \
            -srcstorepass:env KEYSTORE_PASSWORD \
            -srcalias "$KEY_ALIAS" \
            -srckeypass:env KEY_PASSWORD \
            -destkeystore "$pkcs12" \
            -deststoretype PKCS12 \
            -deststorepass:env HAPANELD_PKCS12_PASSWORD \
            -destkeypass:env HAPANELD_PKCS12_PASSWORD \
            -noprompt
          /usr/bin/openssl pkcs12 \
            -in "$pkcs12" \
            -nodes \
            -nocerts \
            -passin env:HAPANELD_PKCS12_PASSWORD \
            -out "$private_key"
          /usr/bin/chmod 0600 "$private_key"
          /usr/bin/openssl pkey -in "$private_key" -pubout -out "$public_key"
          signing_public_key_sha256=$(/usr/bin/openssl pkey -pubin -in "$public_key" -outform DER | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)
          if [ "$signing_public_key_sha256" != "$trusted_public_key_sha256" ]; then
            echo "::error::APK signing key does not match the release proof authority."
            exit 1
          fi
          unset KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD HAPANELD_PKCS12_PASSWORD

          for proof_name in "$provisioner_name" "$helper_arm_name" "$helper_arm64_name"; do
            if [ ! -f "dist/$proof_name" ] || [ -L "dist/$proof_name" ]; then
              echo "::error::Release proof subject is not a regular nofollow file: $proof_name"
              exit 1
            fi
            /usr/bin/sha256sum "dist/$proof_name" | /usr/bin/sed "s|  dist/|  |" > "$proof_dir/$proof_name.sha256"
            if ! /usr/bin/cmp --silent "$proof_dir/$proof_name.sha256" "dist/$proof_name.sha256" || \
               ! (cd dist && /usr/bin/sha256sum --strict --check "$proof_name.sha256"); then
              echo "::error::Release checksum record does not bind the exact asset: $proof_name"
              exit 1
            fi
          done

          /usr/bin/openssl dgst -sha256 -sign "$private_key" -out "dist/$descriptor_name.sig" "dist/$descriptor_name"
          /usr/bin/openssl dgst -sha256 -verify "$public_key" -signature "dist/$descriptor_name.sig" "dist/$descriptor_name"
          for checksum_name in "$apk_name.sha256" "$provisioner_name.sha256" "$helper_arm_name.sha256" "$helper_arm64_name.sha256"; do
            /usr/bin/openssl dgst -sha256 -sign "$private_key" -out "dist/$checksum_name.sig" "dist/$checksum_name"
            /usr/bin/openssl dgst -sha256 -verify "$public_key" -signature "dist/$checksum_name.sig" "dist/$checksum_name"
          done

      - name: Attest release asset provenance
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest Android and Gradle runtime SBOM
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.asset.outputs.apk_name }}
          sbom-path: dist/${{ steps.asset.outputs.android_sbom_name }}

      - name: Attest profile-editor runtime SBOM
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.asset.outputs.apk_name }}
          sbom-path: dist/${{ steps.asset.outputs.profile_editor_sbom_name }}

      - name: Final exact verification before publication
        run: |
          set -euo pipefail
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          apk_idsig="dist/$apk_name.idsig"
          descriptor_name="ha-paneld-${RELEASE_TAG}-install.json"
          provisioner_name="ha-paneld-provision-${RELEASE_TAG}.sh"
          helper_arm_name="ha-paneld-helper-${RELEASE_TAG}-armeabi-v7a"
          helper_arm64_name="ha-paneld-helper-${RELEASE_TAG}-arm64-v8a"
          expected=$(/usr/bin/printf '%s\n' \
            "ha-paneld-${RELEASE_TAG}-android-gradle-runtime.cdx.json" \
            "$descriptor_name" \
            "$descriptor_name.sig" \
            "$helper_arm64_name" \
            "$helper_arm64_name.sha256" \
            "$helper_arm64_name.sha256.sig" \
            "$helper_arm_name" \
            "$helper_arm_name.sha256" \
            "$helper_arm_name.sha256.sig" \
            "ha-paneld-installer-${RELEASE_TAG}.sh" \
            "$apk_name" \
            "$apk_name.idsig" \
            "$apk_name.sha256" \
            "$apk_name.sha256.sig" \
            "ha-paneld-${RELEASE_TAG}-profile-editor-runtime.cdx.json" \
            "$provisioner_name" \
            "$provisioner_name.sha256" \
            "$provisioner_name.sha256.sig" | /usr/bin/sort)
          actual=$(/usr/bin/find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | /usr/bin/sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Final release asset set is not exact."
            /usr/bin/diff -u <(/usr/bin/printf '%s\n' "$expected") <(/usr/bin/printf '%s\n' "$actual") || true
            exit 1
          fi
          while IFS= read -r asset; do
            if [ ! -f "dist/$asset" ] || [ -L "dist/$asset" ]; then
              echo "::error::Release asset is not a regular nofollow file: $asset"
              exit 1
            fi
          done <<<"$expected"

          idsig_size=$(/usr/bin/stat --format='%s' "$apk_idsig")
          if [ "$idsig_size" -le 0 ] || [ "$idsig_size" -gt 1048576 ]; then
            echo "::error::Final APK Signature Scheme v4 sidecar is empty or exceeds 1 MiB."
            exit 1
          fi

          final_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/final-release-proof.XXXXXX")
          trap '/usr/bin/rm -rf -- "$final_dir"' EXIT
          public_key="$final_dir/release-public-key.pem"
          installer="dist/ha-paneld-installer-${RELEASE_TAG}.sh"
          if [ "$(/usr/bin/grep -c '^-----BEGIN PUBLIC KEY-----$' "$installer")" -ne 1 ] || \
             [ "$(/usr/bin/grep -c '^-----END PUBLIC KEY-----$' "$installer")" -ne 1 ]; then
            echo "::error::Release installer does not contain exactly one trusted public key."
            exit 1
          fi
          /usr/bin/awk '/^-----BEGIN PUBLIC KEY-----$/{copy=1} copy{print} /^-----END PUBLIC KEY-----$/{exit}' \
            "$installer" > "$public_key"
          trusted_public_key_sha256=$(/usr/bin/openssl pkey -pubin -in "$public_key" -outform DER | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)
          if [ "$trusted_public_key_sha256" != 502bf38874682ff337f187022b904adbc3ab0b387fd7ceb4043ce722997273f3 ]; then
            echo "::error::Final release proof authority is not trusted."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --v4-signature-file "$apk_idsig" \
            --verbose \
            --print-certs \
            "dist/$apk_name"
          mapfile -t signer_digests < <("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --v4-signature-file "$apk_idsig" --print-certs "dist/$apk_name" | /usr/bin/sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          signer_digest=$(/usr/bin/printf '%s' "${signer_digests[0]:-}" | /usr/bin/tr '[:upper:]' '[:lower:]')
          if [ "${#signer_digests[@]}" -ne 1 ] || \
             [ "$signer_digest" != ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339 ]; then
            echo "::error::Final release APK signer is not the release authority."
            exit 1
          fi

          for checksum_name in "$apk_name.sha256" "$provisioner_name.sha256" "$helper_arm_name.sha256" "$helper_arm64_name.sha256"; do
            (cd dist && /usr/bin/sha256sum --strict --check "$checksum_name")
            /usr/bin/openssl dgst -sha256 -verify "$public_key" -signature "dist/$checksum_name.sig" "dist/$checksum_name"
          done
          /usr/bin/openssl dgst -sha256 -verify "$public_key" -signature "dist/$descriptor_name.sig" "dist/$descriptor_name"
          final_apk_sha256=$(/usr/bin/sha256sum "dist/$apk_name" | /usr/bin/cut -d' ' -f1)
          final_apk_size=$(/usr/bin/stat --format='%s' "dist/$apk_name")
          if ! /usr/bin/jq -e \
            --arg apk_name "$apk_name" \
            --arg apk_sha256 "$final_apk_sha256" \
            --argjson apk_size "$final_apk_size" \
            --arg release_tag "$RELEASE_TAG" \
            'keys == ["apkName","apkSha256","apkSize","databaseCompatibility","launchComponent","minSdk","packageId","releaseTag","schema","signerCertificateSha256","supportedAbis","versionCode","versionName"] and
             .apkName == $apk_name and .apkSha256 == $apk_sha256 and .apkSize == $apk_size and
             .releaseTag == $release_tag and .schema == "io.github.maxlyth.hapaneld.install.v1" and
             .packageId == "io.github.maxlyth.hapaneld" and
             .signerCertificateSha256 == "ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339"' \
            "dist/$descriptor_name" >/dev/null; then
            echo "::error::Final signed descriptor does not bind the exact final release APK."
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: release-input/release-body.md
          # Tags with a suffix (e.g. v0.5.0-rc1) publish as pre-releases.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
