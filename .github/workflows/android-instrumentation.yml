name: Android instrumentation
run-name: Android instrumentation · ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

# Keep the two emulator boots outside the normal source gate. Run them for changes that can affect
# Android compatibility, after those changes reach main, during nightly coverage, and on demand.
on:
  pull_request:
    paths:
      - '.github/workflows/android-instrumentation.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'app/gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'app/src/androidTest/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-instrumentation.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'app/gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'app/src/androidTest/**'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Branch and PR updates supersede their predecessors. Main checks belong to a
# commit, so later pushes cannot evict a release cut even while it is pending.
# Tags, manual trials and schedules each retain their own independent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  instrumentation:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced

      - name: Install build SDK, NDK, and emulator image
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-${{ matrix.api-level }};default;x86_64" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM group permissions
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Verify KVM acceleration for API 35
        if: matrix.api-level == 35
        run: |
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run core instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: >-
            bash -euo pipefail -c '
            adb install app/build/outputs/apk/debug/app-debug.apk;
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk;
            log="$RUNNER_TEMP/core-instrumentation.log";
            status=0;
            adb logcat -c;
            adb shell am instrument -w -e annotation io.panelassistant.android.CoreInstrumentation io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?;
            cat "$log";
            if [ "$status" -ne 0 ] || grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi;
            test "$status" -eq 0;
            if grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then exit 1; fi;
            grep -Eq "^OK \\([1-9][0-9]* tests?\\)[[:space:]]*$" "$log";
            run_one() {
              local selector="$1" label="$2" seconds="$3";
              adb shell am force-stop io.panelassistant.android;
              adb shell am force-stop io.panelassistant.android.test;
              log="$RUNNER_TEMP/$label.log";
              status=0;
              timeout "$seconds" adb shell am instrument -w -e class "$selector" io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?;
              cat "$log";
              if [ "$status" -ne 0 ] || grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi;
              test "$status" -eq 0;
              if grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then exit 1; fi;
              grep -Eq "^OK \\(1 test\\)[[:space:]]*$" "$log";
            };
            test "$(adb shell getprop ro.kernel.qemu | tr -d "\r")" = 1;
            adb shell am force-stop io.panelassistant.android;
            adb shell am force-stop io.panelassistant.android.test;
            trap "adb shell appops set io.panelassistant.android SYSTEM_ALERT_WINDOW default" EXIT;
            adb shell appops set io.panelassistant.android SYSTEM_ALERT_WINDOW allow;
            log="$RUNNER_TEMP/overlay-wake-tap-instrumentation.log";
            status=0;
            adb logcat -c;
            timeout 150 adb shell am instrument -w -e class io.panelassistant.android.control.OverlayWakeTapInstrumentedTest io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?;
            cat "$log";
            if [ "$status" -ne 0 ] || grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi;
            test "$status" -eq 0;
            if grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then exit 1; fi;
            grep -Eq "^OK \\(3 tests\\)[[:space:]]*$" "$log";
            adb shell appops set io.panelassistant.android SYSTEM_ALERT_WINDOW default;
            trap - EXIT;
            if [ "${{ matrix.api-level }}" -ge 28 ]; then
              for method in coldAdminLauncher coldMain coldDashboard coldConfigure coldProximityWizard; do
                run_one "io.panelassistant.android.MainThreadSqliteInstrumentedTest#$method" "sqlite-$method" 90;
              done;
            fi;
            adb shell ip -4 addr;
            adb shell ip link;
            run_one io.panelassistant.android.ClonedDiscoveryInstrumentedTest cloned-discovery 180;
            test "$(adb shell pm clear io.panelassistant.android | tr -d "\r")" = Success;
            test "$(adb shell pm clear io.panelassistant.android.test | tr -d "\r")" = Success;
            run_one io.panelassistant.android.ScheduledInstallInstrumentedTest scheduled-install 150;
            for method in urlWithoutTokenShowsPhysicalSignIn entityLearningWithoutTokenStillShowsPhysicalSignIn configuredTokenWaitsForTheUnansweredSetupQuestion; do
              adb shell am force-stop io.panelassistant.android;
              adb shell am force-stop io.panelassistant.android.test;
              test "$(adb shell pm clear io.panelassistant.android | tr -d "\r")" = Success;
              test "$(adb shell pm clear io.panelassistant.android.test | tr -d "\r")" = Success;
              run_one "io.panelassistant.android.FirstRunSignInInstrumentedTest#$method" "first-run-sign-in-$method" 150;
            done'

      - name: Run all status surface cases on the smallest supported panel
        if: matrix.api-level == 27
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/root-status-avd"
          export ANDROID_SERIAL=emulator-5582
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name root-status --package "system-images;android-27;default;x86_64"
          config="$ANDROID_AVD_HOME/root-status.avd/config.ini"
          sed -i -E '/^(hw.lcd.(width|height|density)|hw.mainKeys|skin.(name|path)|showDeviceFrame)[[:space:]]*=/d' "$config"
          cat >> "$config" <<'AVD'
          hw.lcd.width = 480
          hw.lcd.height = 480
          hw.lcd.density = 160
          hw.mainKeys = yes
          skin.name = 480x480
          skin.path = 480x480
          showDeviceFrame = no
          AVD
          timeout --kill-after=5s 1100 "$ANDROID_HOME/emulator/emulator" -avd root-status -ports 5582,5583 -no-window -accel on -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -memory 2048 -cores 2 > "$RUNNER_TEMP/status-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'timeout 10 adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" || true' EXIT
          timeout 180 adb wait-for-device
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global policy_control immersive.full=io.panelassistant.android
          adb shell wm size
          adb shell wm density
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          log="$RUNNER_TEMP/status-surface.log"
          status=0
          timeout 600 adb shell am instrument -w -e class io.panelassistant.android.StatusSurfaceInstrumentedTest io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ] || grep -Eq 'FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found' "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi
          test "$status" -eq 0
          if grep -Eq 'FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found' "$log"; then exit 1; fi
          grep -Eq '^OK \(12 tests\)[[:space:]]*$' "$log"
