name: Android instrumentation
run-name: Android instrumentation · ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

# Keep the two emulator boots outside the normal source gate. Run them for changes that can affect
# Android compatibility, after those changes reach main, during nightly coverage, and on demand.
on:
  pull_request:
    paths:
      - '.github/workflows/android-instrumentation.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'app/gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'app/src/androidTest/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-instrumentation.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'app/gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'app/src/androidTest/**'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Branch and PR updates supersede their predecessors. Main checks belong to a
# commit, so later pushes cannot evict a release cut even while it is pending.
# Tags, manual trials and schedules each retain their own independent run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  instrumentation:
    name: API ${{ matrix.api-level }}
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') && vars.CI_RUNNER == 'blacksmith' && (vars.CI_BLACKSMITH_HEAVY_RUNNER || 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Blacksmith serves actions/cache from beside its runners (a 423 MB Gradle entry restores in 2 s), so the
      # pinned SDK packages and setup-android's command-line tools come from it rather than dl.google.com, whose
      # NDK and command-line tools downloads took 6 to 53 s per job. Hosted runners skip it: this repository's
      # GitHub cache is at its 10 GB limit and an NDK entry would evict the Gradle caches. A miss or a stale
      # entry only costs the download, because the install step still checks every package.
      - name: Restore the Android SDK packages
        if: startsWith(runner.name, 'blacksmith-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/cmdline-tools/22.0
            /usr/local/lib/android/sdk/platforms/android-37.0
            /usr/local/lib/android/sdk/build-tools/36.0.0
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}/default/x86_64
          key: android-sdk-v1-${{ runner.os }}-cmdline-tools-22.0-platforms-37.0-build-tools-36.0.0-ndk-27.0.12077973-cmake-3.22.1-system-image-${{ matrix.api-level }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced

      - name: Install build SDK, NDK, and emulator image
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-${{ matrix.api-level }};default;x86_64" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM group permissions
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Verify KVM acceleration for API 35
        if: matrix.api-level == 35
        run: |
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run core instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # Keep all lines equally indented so YAML folds this into one shell command.
          # The emulator action executes each parsed newline separately.
          # The app declares HOME, so a fresh API 35 emulator can show the system home chooser; that chooser
          # hides every app overlay, and the wake-tap taps then reach it instead. home_preflight pins Launcher3.
          script: >-
            bash -euo pipefail -c '
            adb install app/build/outputs/apk/debug/app-debug.apk;
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk;
            avd_adb() {
            local qemu; qemu="$(timeout 10 adb -s "$ANDROID_SERIAL" shell getprop ro.kernel.qemu | tr -d "\r")" || return $?; test "$qemu" = 1 || return 1;
            timeout 20 adb -s "$ANDROID_SERIAL" "$@";
            };
            clear_app_data() {
            local output status=0;
            output="$(adb shell pm clear "$1" 2>&1)" || status=$?;
            printf "pm clear %s (exit %s):\n%s\n" "$1" "$status" "$output";
            test "$status" -eq 0;
            test "$(printf "%s" "$output" | tr -d "\r")" = Success;
            };
            launcher_anr_preflight() {
            local label="$1" windows anrs;
            [[ "$ANDROID_SERIAL" =~ ^emulator-[0-9]+$ ]] || return 1;
            windows="$(avd_adb shell dumpsys window windows)"; test -n "$windows"; printf "%s\n" "$windows" > "$RUNNER_TEMP/$label-windows-before.txt";
            anrs="$(printf "%s\n" "$windows" | grep -E "^  Window #[0-9]+ .*Application Not Responding:" || true)";
            if [ -n "$anrs" ]; then
            test "$(printf "%s\n" "$anrs" | wc -l)" -eq 1;
            printf "%s\n" "$anrs" | grep -Eq "^  Window #[0-9]+ Window\\{[0-9a-f]+ u0 Application Not Responding: com\\.android\\.launcher3\\}:$";
            avd_adb shell am force-stop --user 0 com.android.launcher3;
            windows="$(avd_adb shell dumpsys window windows)"; test -n "$windows"; printf "%s\n" "$windows" > "$RUNNER_TEMP/$label-windows-after.txt";
            if printf "%s\n" "$windows" | grep -Eq "^  Window #[0-9]+ .*Application Not Responding:"; then return 1; fi;
            fi;
            };
            home_preflight() {
            local focus;
            avd_adb shell cmd package set-home-activity --user 0 com.android.launcher3 > /dev/null;
            avd_adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME > /dev/null;
            focus="$(avd_adb shell dumpsys window | grep -E "mCurrentFocus=" || true)"; printf "%s\n" "$focus";
            [[ "$focus" == *"mCurrentFocus=Window{"*" u0 com.android.launcher3/"* ]];
            };
            launcher_anr_preflight before-core;
            log="$RUNNER_TEMP/core-instrumentation.log";
            status=0;
            adb logcat -c;
            adb shell am instrument -w -e annotation io.panelassistant.android.CoreInstrumentation io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?;
            cat "$log";
            if [ "$status" -ne 0 ] || grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi;
            test "$status" -eq 0;
            if grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then exit 1; fi;
            grep -Eq "^OK \\([1-9][0-9]* tests?\\)[[:space:]]*$" "$log";
            run_one() {
            local selector="$1" label="$2" seconds="$3";
            adb shell am force-stop io.panelassistant.android;
            adb shell am force-stop io.panelassistant.android.test;
            log="$RUNNER_TEMP/$label.log";
            status=0;
            timeout "$seconds" adb shell am instrument -w -e class "$selector" io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?;
            cat "$log";
            if [ "$status" -ne 0 ] || grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi;
            test "$status" -eq 0;
            if grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then exit 1; fi;
            grep -Eq "^OK \\(1 test\\)[[:space:]]*$" "$log";
            };
            launcher_anr_preflight before-overlay;
            test "$(adb shell getprop ro.kernel.qemu | tr -d "\r")" = 1;
            adb shell am force-stop io.panelassistant.android;
            adb shell am force-stop io.panelassistant.android.test;
            clear_app_data io.panelassistant.android;
            clear_app_data io.panelassistant.android.test;
            trap "adb shell appops set io.panelassistant.android SYSTEM_ALERT_WINDOW default" EXIT;
            adb shell appops set io.panelassistant.android SYSTEM_ALERT_WINDOW allow;
            if [ "${{ matrix.api-level }}" -ge 29 ]; then home_preflight; fi;
            log="$RUNNER_TEMP/overlay-wake-tap-instrumentation.log";
            status=0;
            adb logcat -c;
            timeout 150 adb shell am instrument -w -e class io.panelassistant.android.control.OverlayWakeTapInstrumentedTest io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?;
            cat "$log";
            if [ "$status" -ne 0 ] || grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi;
            test "$status" -eq 0;
            if grep -Eq "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found" "$log"; then exit 1; fi;
            grep -Eq "^OK \\(3 tests\\)[[:space:]]*$" "$log";
            adb shell appops set io.panelassistant.android SYSTEM_ALERT_WINDOW default;
            trap - EXIT;
            if [ "${{ matrix.api-level }}" -ge 28 ]; then
            for method in coldAdminLauncher coldMain coldDashboard coldConfigure coldProximityWizard; do
            run_one "io.panelassistant.android.MainThreadSqliteInstrumentedTest#$method" "sqlite-$method" 90;
            done;
            fi;
            adb shell ip -4 addr;
            adb shell ip link;
            run_one io.panelassistant.android.ClonedDiscoveryInstrumentedTest cloned-discovery 180;
            clear_app_data io.panelassistant.android;
            clear_app_data io.panelassistant.android.test;
            run_one io.panelassistant.android.ScheduledInstallInstrumentedTest scheduled-install 150;
            for method in urlWithoutTokenShowsPhysicalSignIn entityLearningWithoutTokenStillShowsPhysicalSignIn configuredTokenWaitsForTheUnansweredSetupQuestion; do
            adb shell am force-stop io.panelassistant.android;
            adb shell am force-stop io.panelassistant.android.test;
            clear_app_data io.panelassistant.android;
            clear_app_data io.panelassistant.android.test;
            run_one "io.panelassistant.android.FirstRunSignInInstrumentedTest#$method" "first-run-sign-in-$method" 150;
            done'

      - name: Run all status surface cases on the smallest supported panel
        if: matrix.api-level == 27
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/root-status-avd"
          export ANDROID_SERIAL=emulator-5582
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name root-status --package "system-images;android-27;default;x86_64"
          config="$ANDROID_AVD_HOME/root-status.avd/config.ini"
          sed -i -E '/^(hw.lcd.(width|height|density)|hw.mainKeys|skin.(name|path)|showDeviceFrame)[[:space:]]*=/d' "$config"
          cat >> "$config" <<'AVD'
          hw.lcd.width = 480
          hw.lcd.height = 480
          hw.lcd.density = 160
          hw.mainKeys = yes
          skin.name = 480x480
          skin.path = 480x480
          showDeviceFrame = no
          AVD
          timeout --kill-after=5s 1100 "$ANDROID_HOME/emulator/emulator" -avd root-status -ports 5582,5583 -no-window -accel on -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -memory 2048 -cores 2 > "$RUNNER_TEMP/status-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'timeout 10 adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true; wait "$emulator_pid" || true' EXIT
          timeout 180 adb wait-for-device
          for _ in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          adb shell settings put secure immersive_mode_confirmations confirmed
          test "$(adb shell settings get secure immersive_mode_confirmations | tr -d '\r')" = confirmed
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global policy_control immersive.full=io.panelassistant.android
          adb shell wm size
          adb shell wm density
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          log="$RUNNER_TEMP/status-surface.log"
          status=0
          timeout 600 adb shell am instrument -w -e class io.panelassistant.android.StatusSurfaceInstrumentedTest io.panelassistant.android.test/androidx.test.runner.AndroidJUnitRunner > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ] || grep -Eq 'FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found' "$log"; then adb logcat -d -b main,crash,system | tail -n 3000; fi
          test "$status" -eq 0
          if grep -Eq 'FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED|shortMsg=|No tests found' "$log"; then exit 1; fi
          grep -Eq '^OK \(12 tests\)[[:space:]]*$' "$log"

      - name: Show connected devices on failure
        if: failure()
        run: adb devices -l

      - name: Upload emulator crash reports and instrumentation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumentation-diagnostics-api-${{ matrix.api-level }}
          path: |
            /tmp/android-runner/emu-crash-*.db
            ${{ runner.temp }}/*.log
          if-no-files-found: warn

  # Warns, never fails, when this push to main has taken longer than the workflow's budget in
  # .github/ci-budget.json, or when one of its set-up steps took longer than the per-step budget, so a
  # slowdown shows on the push that caused it rather than in the next weekly check. GitHub-hosted on purpose.
  budget:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [instrumentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the budget
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Compare this run's time with its budget
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_ci_budget.py --this-run
