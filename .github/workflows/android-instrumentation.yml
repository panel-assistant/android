name: Android instrumentation
run-name: Android instrumentation · ${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}

# Keep the two emulator boots outside the normal source gate. Run them for changes that can affect
# Android compatibility, after those changes reach main, during nightly coverage, and on demand.
on:
  pull_request:
    paths:
      - '.github/workflows/android-instrumentation.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'app/gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'app/src/androidTest/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-instrumentation.yml'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'app/gradle.lockfile'
      - 'gradle/verification-metadata.xml'
      - 'app/src/androidTest/**'
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: enhanced

      - name: Install build SDK, NDK, and emulator image
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-${{ matrix.api-level }};default;x86_64" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM acceleration for API 35
        if: matrix.api-level == 35
        run: |
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run core instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e annotation io.github.maxlyth.hapaneld.CoreInstrumentation io.github.maxlyth.hapaneld.test/androidx.test.runner.AndroidJUnitRunner
