name: F-Droid repo
run-name: F-Droid repo (retired) · ${{ github.event_name }}

# RETIRED 2026-09-12. The channel is no longer chained to the Release workflow, so a new release no
# longer republishes here and the served repository stays where it is. Manual dispatch remains, which
# is what publishes the retirement notice; the tooling is removed once the notice has served its window.
#
# How it worked while it ran:
# Republishes the release-signed APKs from GitHub Releases as a self-hosted F-Droid repository in a
# dedicated Cloudflare R2 bucket. STATELESS: every run rebuilds the repo from the current set of release-key-signed *full*
# GitHub Releases, so the served APK is byte-identical to the release asset and the F-Droid client can
# update panels in place. Pre-releases (…-rcN) and legacy debug-key releases are intentionally excluded.
#
# ONE-TIME SETUP (maintainer):
#   1. Create the ha-paneld-fdroid R2 bucket and attach fdroid.ha-paneld.com as its custom domain.
#   2. Create the protected fdroid environment with FDROID_R2_ACCOUNT_ID plus bucket-scoped
#      FDROID_R2_ACCESS_KEY_ID and FDROID_R2_SECRET_ACCESS_KEY credentials.
#   3. The ANDROID_KEYSTORE_* secrets that sign the release APKs (see release.yml) are currently reused
#      to preserve the repository fingerprint already pinned by clients. The workflow refuses any
#      unexpected key rather than silently rotating that public identity.
#   4. After the first successful run, grab the repo fingerprint from the run log / landing page and
#      share the add-repo URL: https://fdroid.ha-paneld.com/fdroid/repo?fingerprint=<FP>

on:
  # Manual runs rebuild and publish by default, but can stop after constructing the exact publication
  # artifact for a non-publishing validation run.
  workflow_dispatch:
    inputs:
      publish_r2:
        description: Publish the rebuilt repository to R2 (clear for a build-only dry run)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # A build-only validation must never cancel or queue behind the one production R2 lane.
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_r2 && format('fdroid-build-only-{0}', github.run_id) || 'fdroid-r2' }}
  # A publisher must never be cancelled between mutable index writes. Production runs queue instead.
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    # Match the build admission without entering either credential-bearing environment. A failure here
    # stops the publication before index signing and transitively prevents every R2 write in the deploy
    # job. Manual dispatch is now the only trigger, so there is no release condition left to test.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight public F-Droid origin
        run: python3 tools/fdroid/public_origin_preflight.py

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    # Manual dispatch only, since the channel is retired: a release no longer republishes here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard — signing secrets present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::ANDROID_KEYSTORE_* secrets are required to sign the F-Droid index."
              exit 1
            fi
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools

      - name: Install build-tools + fdroidserver
        run: |
          sdkmanager "build-tools;34.0.0"
          python -m pip install --require-hashes -r tools/fdroid/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r tools/fdroid/requirements.txt

      - name: Download released (non-prerelease) APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools/fdroid/repo
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease==false and .isDraft==false) | .tagName')
          echo "Full releases: ${tags[*]:-<none>}"
          for tag in "${tags[@]}"; do
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping non-app release tag: $tag"
              continue
            fi
            case "$tag" in
              v0.3.0|v0.4.0|v0.4.1|v0.4.2)
                echo "Skipping legacy debug-key app release: $tag"
                continue
                ;;
            esac

            asset_names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')"
            canonical_assets=()
            for candidate in \
              "ha-paneld-${tag}-manual-setup-required.apk" \
              "ha-paneld-${tag}.apk"; do
              if grep -Fxq "$candidate" <<< "$asset_names"; then
                canonical_assets+=("$candidate")
              fi
            done
            if [ "${#canonical_assets[@]}" -ne 1 ]; then
              echo "::error::Release $tag must contain exactly one canonical ha-paneld APK; found ${#canonical_assets[@]}."
              exit 1
            fi

            apk_name="${canonical_assets[0]}"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$apk_name" --dir tools/fdroid/repo
            test -s "tools/fdroid/repo/$apk_name"
          done
          ls -la tools/fdroid/repo
          shopt -s nullglob
          apks=(tools/fdroid/repo/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No full-release APKs found to publish."
            exit 1
          fi

      - name: Authenticate every APK before indexing
        env:
          EXPECTED_PACKAGE: io.github.maxlyth.hapaneld
          EXPECTED_SIGNER_SHA256: ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
        run: |
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          shopt -s nullglob
          apks=(tools/fdroid/repo/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APKs are available for authentication."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            apk_name="${apk##*/}"
            tag="${apk_name#ha-paneld-}"
            tag="${tag%-manual-setup-required.apk}"
            tag="${tag%.apk}"
            expected_version="${tag#v}"

            signer_output="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
            mapfile -t signer_digests < <(
              sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9A-Fa-f:]+)$/\1/p' \
                <<< "$signer_output" | tr -d ':' | tr '[:upper:]' '[:lower:]'
            )
            if [ "${#signer_digests[@]}" -ne 1 ] || [ "${signer_digests[0]}" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error file=$apk::Unexpected APK signing certificate."
              exit 1
            fi

            badging="$("$build_tools/aapt" dump badging "$apk")"
            package_name="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            version_name="$(sed -nE "s/^package: .* versionName='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            if [ "$package_name" != "$EXPECTED_PACKAGE" ]; then
              echo "::error file=$apk::Unexpected package name: ${package_name:-<missing>}"
              exit 1
            fi
            if [ "$version_name" != "$expected_version" ]; then
              echo "::error file=$apk::Version ${version_name:-<missing>} does not match release tag $tag."
              exit 1
            fi
            echo "Authenticated $apk_name ($package_name $version_name; signer $EXPECTED_SIGNER_SHA256)."
          done

      - name: Inject signing + SDK config (runtime only — never committed)
        working-directory: tools/fdroid
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_REPO_FINGERPRINT: ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          repo_fingerprint="$(
            keytool -exportcert -keystore "$RUNNER_TEMP/ks.jks" -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
              openssl dgst -sha256 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]'
          )"
          if [ "$repo_fingerprint" != "$EXPECTED_REPO_FINGERPRINT" ]; then
            echo "::error::The configured repository key does not match the published F-Droid fingerprint; refusing to rotate clients silently."
            exit 1
          fi
          {
            echo "sdk_path: $ANDROID_HOME"
            echo "keystore: $RUNNER_TEMP/ks.jks"
            echo "repo_keyalias: $KEY_ALIAS"
            echo "repo_key_sha256: $EXPECTED_REPO_FINGERPRINT"
            echo "keystorepass: $KEYSTORE_PASSWORD"
            echo "keypass: $KEY_PASSWORD"
          } >> config.yml

      - name: Build + sign the repo index
        working-directory: tools/fdroid
        run: fdroid update --create-metadata --pretty --verbose

      - name: Assemble publication (+ inject repo fingerprint into landing page)
        working-directory: tools/fdroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # The F-Droid repo fingerprint is the SHA-256 of the signing certificate (DER), lowercase hex.
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/ks.jks" -alias "$KEY_ALIAS" \
                -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}')
          echo "Repo fingerprint: $FP"
          echo "Add-repo URL: https://fdroid.ha-paneld.com/fdroid/repo?fingerprint=$FP"
          mkdir -p ../../_site/fdroid
          cp -r repo ../../_site/fdroid/repo
          sed "s|@FINGERPRINT@|$FP|g" site-index.html > ../../_site/index.html

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ks.jks" tools/fdroid/config.yml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdroid-site-${{ github.run_id }}
          path: _site
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # Credentialed publication is allowed only from the repository's current default branch. Manual
    # dispatches from any other ref remain useful as build-only validation runs.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.publish_r2) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment:
      name: fdroid
      url: https://fdroid.ha-paneld.com/index.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Recheck from the runner that will publish: Cloudflare policy can vary by source IP. This step
      # receives no credentials and completes before artifact download or any R2 operation.
      - name: Preflight public F-Droid origin on publication runner
        run: python3 tools/fdroid/public_origin_preflight.py

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fdroid-site-${{ github.run_id }}
          path: _site

      - name: Guard — R2 deployment configuration present
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FDROID_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FDROID_R2_SECRET_ACCESS_KEY }}
          FDROID_R2_ACCOUNT_ID: ${{ vars.FDROID_R2_ACCOUNT_ID }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY FDROID_R2_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The fdroid environment must provide bucket-scoped R2 deployment credentials."
              exit 1
            fi
          done
          if [[ ! "$FDROID_R2_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::FDROID_R2_ACCOUNT_ID must be the 32-character Cloudflare account ID."
            exit 1
          fi
          aws --version

      - name: Publish and verify F-Droid repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FDROID_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FDROID_R2_SECRET_ACCESS_KEY }}
          FDROID_R2_ENDPOINT: https://${{ vars.FDROID_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: tools/fdroid/publish-r2.sh _site
