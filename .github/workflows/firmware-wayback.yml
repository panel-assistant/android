name: Firmware Wayback archive
run-name: Firmware Wayback archive · ${{ github.event_name }}

# Preserve the firmware index and every firmware binary in the Internet Archive,
# so the links survive Sonoff taking down or refactoring the CoolKit CDN. Runs
# weekly and whenever the link data changes. Firmware URLs are immutable, so each
# is archived once; state lives on an append-only wayback-state data branch.
#
# Requires a WAYBACK_S3 secret ("accesskey:secret" from a free archive.org
# account at https://archive.org/account/s3.php) — Save Page Now rejects
# anonymous API calls. Without the secret the run skips cleanly (stays green).

on:
  schedule:
    - cron: "37 4 * * 0"   # weekly, Sunday 04:37 UTC
  push:
    branches: [main]
    paths:
      - tools/firmware-index/fw-120p.dat
      - tools/firmware-index/fw-86p.dat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-wayback
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write          # push the wayback-state history branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore archive state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" wayback-state >/dev/null 2>&1; then
            git fetch -q "$repo_url" wayback-state
            git show FETCH_HEAD:wayback.json > wayback.json
          else
            echo '{}' > wayback.json
          fi

      - name: Submit to the Wayback Machine
        env:
          WAYBACK_S3: ${{ secrets.WAYBACK_S3 }}
        run: |
          python tools/firmware-index/wayback_archive.py \
            --state wayback.json \
            --page-url "https://github.com/panel-assistant/android/discussions/7"

      # Append the updated state to the data branch (never force-pushes).
      - name: Persist archive state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$repo_url" wayback-state >/dev/null 2>&1; then
            git clone -q --depth 1 --branch wayback-state "$repo_url" "$work"
          else
            git init -q "$work"
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp wayback.json "$work/wayback.json"
          git -C "$work" add wayback.json
          git -C "$work" commit -q -m "data: wayback archive state $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git -C "$work" push -q "$repo_url" HEAD:wayback-state
