name: Optional · Shizuku emulator
run-name: Optional · Shizuku emulator · ${{ github.ref_name }}

# Slow, dependency-specific integration coverage. Kept separate from pull-request, CI, and release gates.
on:
  schedule:
    - cron: '17 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-shizuku-emulator
  cancel-in-progress: false

jobs:
  integration:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Shizuku provisioning contracts
        run: PROVISION_TEST_SCOPE=all scripts/tests/provision_test.sh

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default package list includes the retired `tools` package, which sdkmanager
          # from cmdline-tools 20.0 can no longer find, so the step failed before doing any work.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Install build SDK, NDK, and emulator image
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-${{ matrix.api-level }};default;x86_64" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Download curated Shizuku manager
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            'https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk' \
            -o "$RUNNER_TEMP/shizuku.apk"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  '"$RUNNER_TEMP/shizuku.apk" | sha256sum -c -

      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise real Shizuku Binder and APK update path
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/shizuku.apk"
            adb shell monkey -p moe.shizuku.privileged.api 1
            native_dir=$(adb shell dumpsys package moe.shizuku.privileged.api | sed -n 's/^[[:space:]]*nativeLibraryDir=//p' | head -1 | tr -d '\r')
            case "$native_dir" in /data/app/*|/mnt/expand/*/app/*) ;; *) echo "Invalid Shizuku native library path" >&2; exit 1 ;; esac
            case "$native_dir" in *[!0-9A-Za-z._/+,:=@~-]*) echo "Unsafe Shizuku native library path" >&2; exit 1 ;; esac
            adb shell test -x "$native_dir/libshizuku.so"
            adb shell "$native_dir/libshizuku.so"
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb push "$RUNNER_TEMP/shizuku.apk" /data/local/tmp/shizuku.apk
            adb shell run-as io.github.maxlyth.hapaneld cp /data/local/tmp/shizuku.apk files/shizuku-test.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e managerApk /data/user/0/io.github.maxlyth.hapaneld/files/shizuku-test.apk -e class io.github.maxlyth.hapaneld.shizuku.ShizukuIntegrationTest io.github.maxlyth.hapaneld.test/androidx.test.runner.AndroidJUnitRunner
