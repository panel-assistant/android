name: Bug report
description: Report a problem with ha-paneld
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The **diagnostic dump** below is the most useful thing you can include —
        it captures the panel hardware, the capability matrix (what works / is degraded on *this*
        firmware) and the running config, and saves a lot of back-and-forth.
  - type: input
    id: version
    attributes:
      label: ha-paneld version
      description: Shown on the panel info page `http://<panel-ip>:8888/` and in `/health`.
      placeholder: e.g. 0.6.2
    validations:
      required: true
  - type: dropdown
    id: panel
    attributes:
      label: Panel hardware
      description: See the [hardware references](https://panel-assistant.io/go/docs?page=hardware/readme) if unsure. The `/diag` output below includes the detected profile, which can help confirm the model.
      options:
        - Sonoff NSPanel Pro (86P / 120P, PX30 / rk3326)
        - Tuya TPA10 (rk3566)
        - Electron / ELCLCD WF1589T (rk3576)
        - ZHICAI SMT1019 / WF2489T
        - ZX-SMT156 / RK3566_T (rk3566 / arm64)
        - Smatek S9E
        - Shelly Wall Display — legacy (Stargate 4", Pegasus X2, Atlantis, MT6580)
        - Shelly Wall Display X2i (Jenna, rk3326)
        - Shelly Wall Display — other modern (Blake XL, Cally, Maverick U1, Dayna D1, arm64)
        - Other (state in description)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
  - type: textarea
    id: diag
    attributes:
      label: Diagnostic dump (`/diag`)
      description: |
        Paste the panel's diagnostic dump. From any machine on the same LAN:

        ```
        curl http://<panel-ip>:8888/api/v1/diag
        ```

        (Or open `http://<panel-ip>:8888/` and copy the **diagnostics / capabilities** section.)
        It contains no secrets — MQTT credentials are not included.
      render: text
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.6.0
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`adb logcat` lines tagged `ha-paneld/*`, or Home Assistant log entries, if any."
      render: shell
