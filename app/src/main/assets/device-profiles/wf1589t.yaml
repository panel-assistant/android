schema: 2
id: wf1589t
version: 2.0.4
display_name: Electron WF1589T
soc_class: rk3576
soc:
  model: Rockchip RK3576
  introduced_year: 2024
  cpu_cores:
    - architecture: Arm Cortex-A72
      count: 4
    - architecture: Arm Cortex-A53
      count: 4
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/wf1589t
  links:
    - label: SoC details
      url: https://www.rock-chips.com/a/en/products/RK35_Series/2024/1212/2033.html
  license: Apache-2.0
  maturity: verified
  tested_firmware:
    - WF1589T Android 14 userdebug (2026-07)
  limitations:
    - The LED uses a conservative transfer until its per-channel response is measured.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - access.android-su
    - input.evdev
    - led.rk3576-ioctl
    - screen.su-blpower
match:
  # Match values are based on the WF1589T firmware and RK3576 identity.
  priority: 500
  fallback: false
  any:
    - priority: 940
      all:
        - field: device
          op: contains
          values:
            - wf1589
    - priority: 900
      all:
        - field: model
          op: equals
          values:
            - rk3576_u
platform:
  # Android su capability was confirmed on the supported WF1589T image.
  su_form: android
  app_can_su: true
  has_recents: true
  # Android 14 on rk3576 draws its own navigation bar, so the soft overlay is unnecessary here and
  # the Native navbar mode is offered. Verified on the WF1589T.
  has_native_navbar: true
hardware:
  led:
    mechanism: rk3576-ioctl
    transfer: rk3576-four-bit
  screen_off: su-blpower
  # Perceptual backlight curve. The firmware pushes Android's brightness setting to the node itself
  # (measured 2026-09-25), so the curve rides on the setting.
  backlight:
    transfer: perceptual
    floor: 10
    route: setting
  camera: true
  camera_lens_offset_px: 43
  microphone: true
  has_button_backlight: false
  touch_click_gain: 0.16
sensors:
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Electron
  model: WF1589T
  model_label_strategy: display-name
input:
  evdev_buttons:
    - node: /dev/input/event1
      code: 116
      grab: true
      event_type: KEYCODE_POWER
      sw: false
cpu:
  governors:
    Performance: performance
    Efficiency: powersave
    Auto: schedutil
display:
  physical_ppi: 226
provisioning:
  software: {}
  display:
    density: 212
  packages:
  - package: com.cghs.stresstest
    desired_state: disabled
    importance: optional
    tags:
      - vendor
      - test
      - clutter
    note: >-
      Factory hardware stress-test ("burn-in") tool (label "Stresstest", priv-app). Production-line QA; not
      used in normal operation.
  - package: com.DeviceTest
    desired_state: disabled
    importance: optional
    tags:
      - chipset
      - test
      - clutter
    note: Generic factory device-test app left in the firmware image. Diagnostic only.
  - package: com.rockchip.devicetest
    desired_state: disabled
    importance: optional
    tags:
      - chipset
      - test
      - clutter
    note: Rockchip (rk3576 SoC) factory device-test suite. Diagnostic only; not used in normal operation.
  - package: com.gulukai.pwmlightdemo
    desired_state: disabled
    importance: recommended
    tags:
      - vendor
      - demo
      - clutter
    note: >-
      Vendor RGB LED demo app (label "PwmLightDemo"). Its boot-started foreground service continuously cycles
      colours through /dev/ledjni, conflicting with ha-paneld LED control; safe to disable.
  - package: com.elclcd.otaupdater
    desired_state: disabled
    importance: optional
    tags:
      - vendor
      - ota
    note: >-
      ELC "Firmware Upgrade" vendor OTA updater. Disable to stop the panel auto-applying vendor firmware
      updates that can re-add bloat.
  recipes: []
