schema: 2
id: s9e
version: 2.2.0
display_name: Smatek S9E
soc_class: rk3566
soc:
  model: Rockchip RK3566
  introduced_year: 2020
  cpu_cores:
    - architecture: Arm Cortex-A55
      count: 4
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/s9e
  links:
    - label: SoC details
      url: https://www.rock-chips.com/a/en/products/RK35_Series/2021/0113/1274.html
    - label: SoC announcement
      url: https://www.rock-chips.com/a/cn/news/rockchip/2020/1130/1368.html
  license: Apache-2.0
  maturity: experimental
  tested_firmware:
    - S9_Android_1.0.2 firmware image
    - S9_Android_1.1.0 firmware image
  limitations:
    - Relays, button LEDs and normal-app su access are reported working by an owner on S9_Android_1.1.0; the 1.0.2 st_relay path is unverified on live hardware.
    - The WebView replacement is unverified on live hardware.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - access.android-su
    - input.evdev
    - relay.gpio-button-led
    - relay.sysfs
    - screen.su-blpower
    - sensor.cht8305-daemon
    - sensor.gpio-proximity
    - update.webview
match:
  # Match values come from observed S9E/RK3566 build properties.
  priority: 500
  fallback: false
  any:
    - priority: 930
      all:
        - field: model
          op: contains
          values:
            - s9e
    - priority: 930
      all:
        - field: device
          op: contains
          values:
            - s9e
    - priority: 930
      all:
        - field: model
          op: equals
          values:
            - s9
    - priority: 930
      all:
        - field: product_version
          op: starts_with
          values:
            - s9
platform:
  # Normal-app su access is reported working by an owner on S9_Android_1.1.0.
  su_form: android
  app_can_su: true
  has_recents: true
hardware:
  led:
    mechanism: none
    transfer: identity
  # su-blpower writes /sys/class/backlight/<dev>/bl_power=4 (FB_BLANK powerdown) for a true backlight-off
  # while Android stays interactive, so buttons still work and no keyguard is raised. brightness-zero only
  # drove brightness to 0, which left the backlight powered (a dim panel, not off). Confirmed on live
  # hardware; the panel already writes sysfs via su for its relays (app_can_su: true).
  screen_off: su-blpower
  has_button_backlight: false
  relay_base: /sys/class/strelay
  relay_base_fallbacks:
    - /sys/class/st_relay
  button_led_gpio_base: 147
sensors:
  proximity_gpio: 18
  # Read from the fixed i2c 1-0040 device-tree path (/sys/devices/platform/twi.1/i2c-1/1-0040/
  # {temp1_input,humidity1_input}, milli-units). This driver registers no hwmon humidity node (the only
  # hwmon instance is an unrelated battery thermal), so the helper's cht8305 reader uses its direct-path
  # fallback rather than a /sys/class/hwmon scan.
  cht8305: true
  room_temp_offset_c: 0.0
identity:
  manufacturer: Smatek
  model: S9E
  model_label_strategy: display-name
input:
  # The adc-keys node carries only F1-F4, so grabbing it takes those four keys off the Android input
  # pipeline (the accessibility path never sees them) and reads them through the root helper instead,
  # which avoids double-reporting. release: true adds the up edge as <event_type>_RELEASED so automations
  # can do press-and-hold. Codes are Linux KEY_F1..KEY_F4 (59-62).
  evdev_buttons:
    - node: /dev/input/event3
      code: 59
      grab: true
      event_type: KEYCODE_F1
      release: true
    - node: /dev/input/event3
      code: 60
      grab: true
      event_type: KEYCODE_F2
      release: true
    - node: /dev/input/event3
      code: 61
      grab: true
      event_type: KEYCODE_F3
      release: true
    - node: /dev/input/event3
      code: 62
      grab: true
      event_type: KEYCODE_F4
      release: true
cpu:
  governors:
    Performance: performance
    Efficiency: powersave
    Auto: schedutil
display: {}
provisioning:
  software:
    webview:
      artifact: lineageos-150-arm64
  display: {}
  packages: []
  recipes: []
