schema: 2
id: shelly-wall-display-x2i
version: 2.7.0
display_name: Shelly Wall Display X2i
soc_class: rk3326
soc:
  model: Rockchip RK3326
  introduced_year: 2018
  cpu_cores:
    - architecture: Arm Cortex-A35
      count: 4
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/shelly-wall-display
  links:
    - label: Vendor firmware changelog
      url: https://github.com/ShellyGroup/Wall-Display-Changelog
    - label: SoC details
      url: https://www.rock-chips.com/a/en/News/Press_Releases/2018/0413/898.html
  license: Apache-2.0
  maturity: verified
  tested_firmware:
    - Jenna 2.5.4-9893aafa, build vJenna.9a5979d, Android 11
    - Jenna 2.7.4-b7b6bc07, build vJenna.9a5979d, Android 11
    - Jenna 2.8.2-7bb488885, build vJenna.9a5979d, Android 11
    - Jenna 2.8.3-48174502c, build vJenna.9a5979d, Android 11
  limitations:
    - Recents is declared absent because the firmware ignores the Recents key from both a foreground app and Settings; only Back and Home are offered.
    - On-board relays at /sys/class/strelay are offered only when the app can read and write their nodes. The tested unit has permissive SELinux; an enforcing build may refuse access despite writable node modes.
    - Relay terminals are inert while the panel is powered over USB instead of mains.
    - Evidence comes from one unit, exercised on factory firmware 2.5.4, again after updating it to 2.7.4, and for selected operations on 2.8.2 and 2.8.3. The measured 2.7.4 update installed a Shelly device-owner policy and left the launcher, sensors and adb posture unchanged; the vendor launcher was a protected package that could not be disabled on either tested firmware.
    - Shelly documents Uninstall all updates under Settings → Reset device for modern models, including X2i, since firmware 2.8.0. It returns only to the one vendor-app version shipped with that unit; arbitrary downgrades and full Android restoration are not established. On the tested unit it was exercised once, returning 2.8.0-beta2 to the factory 2.5.4 build.
    - Returning to a shipped vendor-app version older than 2.6.2 always resets factory defaults. Settings may also be reset on other units; save a configuration backup before recovery.
    - Screen-off asks Shelly's launcher to switch the backlight off over its local RPC on port 8021, with no root; Android stays awake, and the first touch on the dark screen wakes it without reaching the dashboard, which needs the draw-over-apps grant. When the launcher does not answer, Android's own screen timeout turns the display off, which needs Panel Assistant to grant WRITE_SECURE_SETTINGS because the firmware keeps the screen on while plugged in; without either, screen-off dims.
    - While Shelly's launcher runs, the app switches its automatic brightness off through the same local RPC, so the brightness Home Assistant sets is the one shown; it does so again whenever it finds the launcher running.
    - The recommended density of 216 renders the dashboard as the factory density of 240 does at a 90 % renderer zoom, the setting chosen on this unit because text was too large at 240.
    - Home Assistant's Shelly integration reaches Shelly's own launcher on port 8021, which listens only after its main screen has been created once. While Panel Assistant is Home, the app creates it once after each boot beneath a full-screen cover and returns to the dashboard; this needs the draw-over-apps grant, and without it the Shelly integration stays unavailable until Shelly's launcher is opened.
    - The panel declares camera features that no camera backs; ha-paneld offers the camera only when Android enumerates one, so no suppression is declared here.
requires:
  min_core_version: 1.0.0-preview1
  drivers:
    - relay.sysfs
    - screen.vendor-rpc
    - sensor.android
match:
  # The X2i reports Jenna as its model, device and build product. Its product_version
  # carries a shelly_x2 prefix, which is deliberately not matched on: the legacy X2 may
  # share that prefix and the codename alone is already unique.
  priority: 500
  fallback: false
  any:
    - priority: 990
      all:
        - field: model
          op: equals
          values:
            - jenna
    - priority: 990
      all:
        - field: device
          op: equals
          values:
            - jenna
platform:
  # Nothing ha-paneld needs on this panel requires privilege: sensors, brightness,
  # permission grants and launcher takeover all work as an ordinary app.
  su_form: none
  app_can_su: false
  has_recents: false
  # Firmware advertises navigation resources without a usable system bar.
  has_native_navbar: false
  launcher:
    # Shelly's Stargate registers as Home but offers no route to Android Settings.
    # The Launcher button skips it and opens the admin launcher, which lists it as an app.
    vendor_home_packages:
      - cloud.shelly.stargate
    # Stargate's MainActivity owns the local RPC Home Assistant's Shelly integration uses on TCP
    # 8021, which starts only once that activity has been created. While Panel Assistant is Home
    # nothing creates that activity after a boot, so the app starts it once, under a cover.
    vendor_service:
      activity: cloud.shelly.stargate/.activities.MainActivity
      port: 8021
  # Stargate announces the panel under its own hostname whether or not ha-paneld runs, so Panel
  # Assistant can find it after an address change and offer it for installation. Read from a live
  # browse of the bench unit (TXT app=WallDisplay, gen=2); the name ends in the Wi-Fi MAC address.
  vendor_mdns:
    - ShellyWallDisplay-*._shelly._tcp
hardware:
  relay_base: /sys/class/strelay
  led:
    mechanism: none
    transfer: identity
  # The backlight sysfs node refuses an unprivileged write; Stargate, a system app, writes it
  # for the app through Ui.Screen.Set on the vendor_service port. Falls back to the screen timeout.
  screen_off: vendor-rpc
  # From full screen-off, Android wakes on any touch (WAKE_REASON_WAKE_MOTION); a wave wakes it
  # through ha-paneld once proximity is calibrated. The panel has no button.
  local_wake:
    - touch
    - proximity
  # An ES7202 PDM microphone, the codec the WF1589T uses. Android opens it as a 16 kHz stereo
  # stream and hands the app the mono capture it asks for.
  microphone: true
  has_button_backlight: false
sensors:
  proximity_technology: Infrared
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Shelly
  model: Wall Display X2i
  model_label_strategy: display-name
input:
  evdev_buttons: []
  # No physical keys at all (the panel has no button), so no button event is offered to Home Assistant.
  has_physical_buttons: false
cpu: {}
display:
  geometry:
    - width_px: 720
      height_px: 1440
      active_diagonal_in: 6.95
      factory_base_dpi: 240
      evidence: specification
      evidence_note: Shelly Wall Display X2i specification, 6.95-inch 720x1440, about 232 ppi. The firmware's reported 268.9x302.3 dpi is not the glass.
provisioning:
  software: {}
  display:
    density: 216
    font_scale: 1.0
  packages: []
  recipes: []
