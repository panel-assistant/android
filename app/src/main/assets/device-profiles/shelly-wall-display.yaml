schema: 2
id: shelly-wall-display
version: 2.1.3
display_name: Shelly Wall Display (legacy)
soc_class: "Model-dependent (known: MT6580 / SC7731E)"
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/shelly-wall-display
  license: Apache-2.0
  maturity: experimental
  limitations:
    - SoC, relay, proximity, Recents, and display details vary by model and still need live-hardware confirmation.
    - On-board relays are not exposed because no safe supported local control path is known.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - screen.brightness-zero
    - sensor.android
match:
  # Match values are derived from the legacy Shelly Wall Display firmware identity.
  priority: 500
  fallback: false
  any:
    - priority: 960
      all:
        - field: model
          op: equals
          values:
            - stargate
            - pegasus
            - atlantis
    - priority: 960
      all:
        - field: device
          op: equals
          values:
            - stargate
            - pegasus
            - atlantis
    - priority: 960
      all:
        - field: model
          op: starts_with
          values:
            - sawd-0
            - sawd-1
            - sawd-2
    - priority: 960
      all:
        - field: device
          op: starts_with
          values:
            - sawd-0
            - sawd-1
            - sawd-2
    - priority: 960
      all:
        - field: device
          op: contains
          values:
            - k400_mt6580
            - e500_7731e
platform:
  # The application UID is sandboxed; privileged operations use the helper route.
  su_form: none
  app_can_su: false
  has_recents: true
  launcher:
    # Shelly's Stargate registers as Home but offers no route to Android Settings.
    # The Launcher button skips it and opens the admin launcher, which lists it as an app.
    vendor_home_packages:
      - cloud.shelly.stargate
hardware:
  led:
    mechanism: none
    transfer: identity
  screen_off: brightness-zero
  has_button_backlight: false
sensors:
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Shelly
  model: Wall Display
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
