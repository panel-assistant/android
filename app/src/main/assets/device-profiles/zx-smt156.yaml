schema: 2
id: zx-smt156
version: 3.1.3
display_name: ZX-SMT156 / RK3566_T
soc_class: Rockchip rk3566
soc:
  model: Rockchip RK3566
  introduced_year: 2020
  cpu_cores:
    - architecture: Arm Cortex-A55
      count: 4
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/zx-smt156
  links:
    - label: SoC details
      url: https://www.rock-chips.com/a/en/products/RK35_Series/2021/0113/1274.html
    - label: SoC announcement
      url: https://www.rock-chips.com/a/cn/news/rockchip/2020/1130/1368.html
  license: Apache-2.0
  maturity: experimental
  tested_firmware:
    - ZX-SMT156-R128V1.2B
  limitations:
    - The LED uses a conservative transfer until its response is measured.
    - >-
      Room climate is an optional enhanced capability; its scaling is evidence-backed but still awaits
      reporter comparison with the vendor UI.
    - The relay control path is not established.
    - Without the root helper, the optional room-climate reader needs locally approved enhanced access.
    - >-
      The reported installation had no app-accessible su; USB adb-root, vendor engineering, and persistent
      unlock routes remain uncharacterised, while runtime route probes remain decisive.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - led.rk3576-ioctl
    - screen.brightness-zero
    - sensor.android
    - sensor.cht8305-daemon
match:
  # Match values come from observed ZX-SMT156/RK3566_T build properties.
  priority: 500
  fallback: false
  any:
    - priority: 980
      all:
        - field: device
          op: equals
          values:
            - rk3566_t
    - priority: 980
      all:
        - field: model
          op: equals
          values:
            - rk3566_t
platform:
  # These are reported app-install hints, not a claim that USB or vendor root/unlock routes are absent.
  # Runtime authority probes remain decisive; optional enhanced routes use the helper.
  su_form: none
  app_can_su: false
  has_recents: true
hardware:
  led:
    mechanism: rk3576-ioctl
    transfer: rk3576-four-bit
  screen_off: brightness-zero
  has_button_backlight: false
sensors:
  light_technology: Ambient light
  # The GXHT30 vendor driver uses the helper's exact CHT8305-compatible centi-unit input route.
  cht8305: true
  room_temp_offset_c: 0.0
identity:
  model: ZX-SMT156
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
