schema: 2
id: smt1019
version: 3.0.1
display_name: ZHICAI SMT1019
soc_class: rk3576
soc:
  model: Rockchip RK3576
  introduced_year: 2024
  cpu_cores:
    - architecture: Arm Cortex-A72
      count: 4
    - architecture: Arm Cortex-A53
      count: 4
metadata:
  author: ha-paneld maintainers
  source: https://panel-assistant.io/go/docs?page=hardware/smt1019
  links:
    - label: SoC details
      url: https://www.rock-chips.com/a/en/products/RK35_Series/2024/1212/2033.html
  license: Apache-2.0
  maturity: experimental
  tested_firmware:
    - SMT1019 Android 14 stock firmware (GitHub #8)
  limitations:
    - Stock firmware has no su; RGB LED control needs a separately installed root helper.
    - The pinned WebView build still needs live-hardware verification.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - led.rk3576-ioctl-daemon
    - screen.daemon-blpower
    - sensor.cht8305-daemon
    - sensor.vi530x-daemon
    - update.webview
match:
  # Match values come from observed SMT1019/RK3576 build properties.
  priority: 500
  fallback: false
  any:
    - priority: 950
      all:
        - field: device
          op: contains
          values:
            - wf2489
platform:
  # This panel is sandbox-walled; privileged routes use the helper daemon.
  su_form: none
  app_can_su: false
  has_recents: true
hardware:
  led:
    mechanism: rk3576-ioctl-daemon
    transfer: identity
  # The helper drives the backlight's bl_power for a truly dark screen. ScreenController falls through
  # daemon -> su -> brightness-zero at runtime. Stock firmware with neither helper nor direct root gets
  # the previous brightness-zero behaviour. Declaring the capable route costs that stock configuration
  # one refused socket connect per screen-off; helper-less rooted builds can still use direct root.
  screen_off: daemon-blpower
  # Present hardware is offered and the panel proves it: the Electron WF2489T reports this same board and
  # its owner reports voice working once a microphone is declared, so voice is offered here.
  microphone: true
  has_button_backlight: false
sensors:
  # Same GXHT30 part and the same vendor evdev layout as the ZX-SMT156, which already ships this route:
  # `sun-ths` / `sun-hum` are in the helper's exact climate allowlist and are point-read via EVIOCGABS.
  # It was false only because this profile was written from a no-root unit without a privileged read
  # route; that route is a verified root helper or an approved Shizuku shell, not a hardware property.
  # Without either authority the read returns nothing and the default-enabled Room entities publish no
  # value, exactly as on ZX-SMT156 with the same `su_form: none` / `app_can_su: false` posture.
  cht8305: true
  # Evisionics VI530x time-of-flight sensor on i2c 4-006c. The helper starts it and reads the range;
  # nothing reports until it is started, which is why this is a declared route rather than a probe.
  vi530x: true
  room_temp_offset_c: 0.0
identity:
  manufacturer: ZHICAI
  model: SMT1019
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software:
    webview:
      artifact: lineageos-150-arm64
  display: {}
  packages:
  - package: com.elc.smt_test
    desired_state: disabled
    importance: optional
    tags:
      - vendor
      - test
      - clutter
    note: >-
      ELC "smt-test" factory app (in /odm persist, survives factory reset). Vendor QA/test tool; not used in
      normal operation.
  - package: com.DeviceTest
    desired_state: disabled
    importance: optional
    tags:
      - chipset
      - test
      - clutter
    note: Generic factory device-test app (in /odm persist). Diagnostic only.
  - package: com.iiyama.webview.demo
    desired_state: disabled
    importance: optional
    tags:
      - vendor
      - demo
      - clutter
    note: Iiyama WebView demo bundled in the firmware. Not used in normal operation.
  - package: com.elclcd.commonkeepalive
    desired_state: disabled
    importance: optional
    tags:
      - vendor
      - service
    note: >-
      ELC "CommonKeepAlive" background service that keeps vendor apps resident. Safe to disable on a Home
      Assistant panel.
  - package: com.elclcd.otaupdater
    desired_state: disabled
    importance: optional
    tags:
      - vendor
      - ota
    note: >-
      ELC "Firmware Upgrade" — the vendor OTA updater. Disable to stop the panel auto-applying vendor
      firmware updates that can re-add bloat.
  - package: com.android.rockchip.camera2
    desired_state: disabled
    importance: optional
    tags:
      - chipset
    note: 'Rockchip Camera2 / HDMI-in app (label "HdmiIn"). Safe to disable unless you use the camera or HDMI input.'
  recipes: []
