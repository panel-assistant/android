[versions]
# Kotlin 2.4's table names AGP 9.1.0 and Gradle 9.5 as its upper tested versions. AGP 9.1.1 is
# Android's API 37 support patch; Gradle 9.6.1 is a separately gated CI-performance update;
# build.gradle.kts selects Kotlin 2.4.0 explicitly.
agp = "9.3.2"
coreKtx = "1.19.0"
appcompat = "1.8.0"
swiperefresh = "1.2.0"
# androidx.webkit — WebSettingsCompat force-dark for the pre-Android-13 panels' WebViews.
webkit = "1.17.0"
# Ktor CIO server — coroutine-based, no Netty thread-per-connection. Hosts :8888.
ktor = "3.5.2"
# HiveMQ MQTT 5 client. NIO (pure-Java) transport => ABI-agnostic (covers 32-bit armeabi-v7a panels).
# Do NOT add the websocket module (AGP 8.2+ "No matching variant" bug) or epoll native transport.
hivemq = "1.3.17"
# Test-only embeddable MQTT 5 broker. Production continues to depend only on the HiveMQ client.
moquette = "0.18.6"
# JmDNS — cross-API-level mDNS advertise with TXT records (NsdManager TXT handling is weak).
jmdns = "3.6.3"
coroutines = "1.11.0"
slf4j = "2.0.7"
junit = "4.13.2"
# Real org.json for JVM unit tests — the android.jar stub returns defaults (returnDefaultValues),
# which would silently no-op any JSON-building code under test (e.g. the dashboard auth bridge).
orgJson = "20260814"
# Test-only real SQLite (JDBC): reproduces WAL writer-lock BUSY semantics between two connections
# deterministically on the JVM (Issue #91). Never packaged in the APK.
sqliteJdbc = "3.53.2.1"
# Test-only model checker: explores every interleaving of a concurrent unit test at each shared-memory
# access, so an ownership race is reproduced on purpose rather than by luck. Never packaged in the APK.
lincheck = "3.7"
# 3.x raises the library bytecode floor from Java 8 to Java 11; retain 2.10 until it has separate
# oldest-Android runtime qualification rather than coupling that risk to the build-tool migration.
snakeyamlEngine = "3.1.1"
shizuku = "13.1.5"
cyclonedx = "3.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefresh" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
hivemq-mqtt-client = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemq" }
moquette-broker = { group = "de.fraunhofer.iosb.io.moquette", name = "moquette-broker", version.ref = "moquette" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
lincheck = { group = "org.jetbrains.lincheck", name = "lincheck", version.ref = "lincheck" }
snakeyaml-engine = { group = "org.snakeyaml", name = "snakeyaml-engine", version.ref = "snakeyamlEngine" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
