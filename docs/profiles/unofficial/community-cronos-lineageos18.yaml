schema: 2
id: community.cronos-lineageos18
version: 1.0.0
display_name: Unofficial Echo Show 5 Gen 2 (LineageOS 18.1)
soc_class: MediaTek MT8163
metadata:
  author: Community contributor
  source: https://github.com/panel-assistant/android/issues/28
  license: Apache-2.0
  maturity: draft
  tested_firmware:
    - LineageOS 18.1 / Android 11 from one contributor-reflashed unit
  limitations:
    - Stock Fire OS cannot run ha-paneld and is not supported by this profile.
    - Unlocking, reflashing, recovery, and LineageOS maintenance are outside the ha-paneld project.
    - Evidence comes from one contributor's reflashed unit; there is no maintainer or fleet qualification.
    - Hardware-specific control paths beyond ordinary Android brightness and sensors remain unverified.
requires:
  min_core_version: 0.9.3
  drivers:
    - access.android-su
    - screen.brightness-zero
    - sensor.android
match:
  priority: 500
  fallback: false
  any:
    - priority: 990
      all:
        - field: device
          op: equals
          values:
            - cronos
        - field: model
          op: equals
          values:
            - amzn echo show 5 (2nd generation)
platform:
  su_form: android
  app_can_su: true
  has_recents: true
hardware:
  led:
    mechanism: none
    transfer: identity
  screen_off: brightness-zero
  has_button_backlight: false
sensors:
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Amazon
  model: Echo Show 5 (2nd Gen)
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
